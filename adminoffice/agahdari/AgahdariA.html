<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    >

    <title>Office</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background-color: #f4f7f6;
            color: #0f172a;

            -webkit-tap-highlight-color: transparent;
        }

        button {
            font: inherit;
        }

        /* ========================================
           WRAPPER
        ======================================== */

        .wrapper {
            display: flex;
            flex-direction: column;

            min-height: 100vh;
            max-width: 450px;

            margin: 0 auto;
            padding: 20px;
        }

        /* ========================================
           TOP BAR
        ======================================== */

        .top-bar {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 50px;

            margin-top: 10px;
            margin-bottom: 30px;
        }

        .back-btn {
            position: absolute;
            right: 0;

            width: 45px;
            height: 45px;

            background-color:
                rgba(255, 136, 0, 0.12);

            border: none;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #e65100;

            cursor: pointer;

            transition:
                all 0.3s ease;
        }

        .back-btn:hover {
            background-color: #ff8c00;
            color: #ffffff;

            transform:
                scale(1.05);
        }

        .back-btn svg {
            width: 22px;
            height: 22px;
        }

        .page-title {
            margin: 0;

            font-size: 22px;
            font-weight: 800;

            color: #0f172a;

            text-align: center;
        }

        /* ========================================
           NOTIFICATIONS
        ======================================== */

        .notifications-container {
            display: flex;
            flex-direction: column;

            gap: 16px;

            padding-bottom: 30px;
        }

        .noti-card {
            background: #ffffff;

            border-radius: 20px;

            padding: 20px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.04);

            border:
                1px solid #f1f5f9;

            cursor: pointer;

            transition:
                all 0.3s ease;

            position: relative;
        }

        .noti-card:hover,
        .noti-card:active {
            transform:
                translateY(-3px);

            box-shadow:
                0 15px 35px
                rgba(16, 185, 129, 0.08);

            border-color:
                rgba(16, 185, 129, 0.2);
        }

        .unread-dot {
            position: absolute;

            top: 25px;
            left: 20px;

            width: 10px;
            height: 10px;

            background-color: #ff8c00;

            border-radius: 50%;

            box-shadow:
                0 0 10px
                rgba(255, 136, 0, 0.5);
        }

        .noti-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 12px;
            padding-bottom: 12px;

            border-bottom:
                1px dashed #e2e8f0;
        }

        .sender-info {
            display: flex;
            align-items: center;

            gap: 12px;
        }

        .sender-icon {
            width: 42px;
            height: 42px;

            background-color:
                rgba(16, 185, 129, 0.05);

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #10b981;

            flex-shrink: 0;

            border:
                1px solid
                rgba(16, 185, 129, 0.2);
        }

        .sender-icon svg {
            width: 20px;
            height: 20px;
        }

        .sender-details {
            display: flex;
            flex-direction: column;

            gap: 3px;
        }

        .sender-name {
            margin: 0;

            font-size: 15px;
            font-weight: 800;

            color: #1e293b;
        }

        .noti-time {
            font-size: 12px;

            color: #94a3b8;

            font-weight: 600;
        }

        .noti-body {
            padding-top: 5px;
        }

        .noti-desc {
            margin: 0;

            font-size: 14px;

            color: #475569;

            line-height: 1.6;

            font-weight: 500;
        }

        .unread .noti-desc {
            color: #0f172a;

            font-weight: 700;
        }

        /* ========================================
           EMPTY STATE
        ======================================== */

        .empty-state {
            width: 100%;

            background: #ffffff;

            border:
                1px solid #f1f5f9;

            border-radius: 24px;

            padding:
                46px 22px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.035);
        }

        .empty-icon {
            width: 76px;
            height: 76px;

            margin:
                0 auto 18px;

            border-radius: 50%;

            background:
                rgba(255, 140, 0, 0.10);

            color: #ff8c00;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .empty-icon svg {
            width: 34px;
            height: 34px;
        }

        .empty-state h2 {
            margin:
                0 0 10px;

            font-size: 20px;
            font-weight: 800;

            color: #1e293b;
        }

        .empty-state p {
            margin: 0;

            font-size: 14px;

            color: #64748b;

            line-height: 1.8;
        }

        /* ========================================
           TABLET
        ======================================== */

        @media
        (min-width: 601px)
        and
        (max-width: 1023px) {

            .wrapper {
                max-width: 760px;

                padding: 30px;
            }

            .top-bar {
                height: 60px;

                margin-top: 12px;
                margin-bottom: 34px;
            }

            .back-btn {
                width: 54px;
                height: 54px;
            }

            .back-btn svg {
                width: 26px;
                height: 26px;
            }

            .page-title {
                font-size: 30px;
            }

            .notifications-container {
                gap: 22px;

                padding-bottom: 42px;
            }

            .noti-card {
                border-radius: 25px;

                padding: 26px;
            }

            .noti-header {
                margin-bottom: 16px;

                padding-bottom: 16px;
            }

            .sender-info {
                gap: 16px;
            }

            .sender-icon {
                width: 58px;
                height: 58px;
            }

            .sender-icon svg {
                width: 27px;
                height: 27px;
            }

            .sender-name {
                font-size: 20px;
            }

            .noti-time {
                font-size: 15px;
            }

            .noti-desc {
                font-size: 18px;

                line-height: 1.8;
            }

            .unread-dot {
                top: 31px;
                left: 26px;

                width: 12px;
                height: 12px;
            }

            .empty-state {
                padding:
                    68px 30px;

                border-radius: 28px;
            }

            .empty-icon {
                width: 92px;
                height: 92px;

                margin-bottom: 22px;
            }

            .empty-icon svg {
                width: 42px;
                height: 42px;
            }

            .empty-state h2 {
                font-size: 25px;
            }

            .empty-state p {
                font-size: 17px;
            }

        }

        /* ========================================
           LAPTOP / DESKTOP
        ======================================== */

        @media
        (min-width: 1024px)
        and
        (hover: hover)
        and
        (pointer: fine) {

            .wrapper {
                max-width: 1240px;

                padding:
                    42px 48px 56px;
            }

            .top-bar {
                height: 70px;

                margin-top: 10px;
                margin-bottom: 42px;
            }

            .back-btn {
                width: 62px;
                height: 62px;
            }

            .back-btn svg {
                width: 30px;
                height: 30px;
            }

            .page-title {
                font-size: 38px;
            }

            .notifications-container {
                display: grid;

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                gap: 28px;

                padding-bottom: 52px;
            }

            .noti-card {
                min-height: 210px;

                border-radius: 30px;

                padding: 34px;
            }

            .noti-header {
                margin-bottom: 20px;

                padding-bottom: 18px;
            }

            .sender-info {
                gap: 18px;
            }

            .sender-icon {
                width: 72px;
                height: 72px;
            }

            .sender-icon svg {
                width: 34px;
                height: 34px;
            }

            .sender-details {
                gap: 6px;
            }

            .sender-name {
                font-size: 24px;
            }

            .noti-time {
                font-size: 17px;
            }

            .noti-body {
                padding-top: 8px;
            }

            .noti-desc {
                font-size: 21px;

                line-height: 1.85;
            }

            .unread-dot {
                top: 38px;
                left: 34px;

                width: 14px;
                height: 14px;
            }

            .empty-state {
                grid-column:
                    1 / -1;

                min-height: 330px;

                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;

                padding:
                    60px 40px;

                border-radius: 32px;
            }

            .empty-icon {
                width: 110px;
                height: 110px;

                margin-bottom: 26px;
            }

            .empty-icon svg {
                width: 50px;
                height: 50px;
            }

            .empty-state h2 {
                font-size: 30px;
            }

            .empty-state p {
                max-width: 560px;

                font-size: 19px;
            }

        }

        /* ========================================
           LARGE DESKTOP
        ======================================== */

        @media
        (min-width: 1440px)
        and
        (hover: hover)
        and
        (pointer: fine) {

            .wrapper {
                max-width: 1440px;

                padding:
                    50px 60px 68px;
            }

            .top-bar {
                margin-bottom: 48px;
            }

            .back-btn {
                width: 68px;
                height: 68px;
            }

            .back-btn svg {
                width: 33px;
                height: 33px;
            }

            .page-title {
                font-size: 42px;
            }

            .notifications-container {
                gap: 32px;
            }

            .noti-card {
                min-height: 235px;

                padding: 38px;

                border-radius: 32px;
            }

            .sender-icon {
                width: 78px;
                height: 78px;
            }

            .sender-icon svg {
                width: 37px;
                height: 37px;
            }

            .sender-name {
                font-size: 27px;
            }

            .noti-time {
                font-size: 18px;
            }

            .noti-desc {
                font-size: 23px;

                line-height: 1.9;
            }

            .empty-state {
                min-height: 370px;
            }

        }

    </style>
</head>

<body>

    <div class="wrapper">

        <div class="top-bar">

            <button
                type="button"
                class="back-btn"
                onclick="window.history.back()"
                aria-label="زڤرین"
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2.5"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M9 5l7 7-7 7"
                    />
                </svg>

            </button>

            <h1 class="page-title">
                ئاگەهداری
            </h1>

        </div>


        <div
            class="notifications-container"
            id="notificationsContainer"
        >

            <div
                class="empty-state"
                id="emptyState"
            >

                <div class="empty-icon">

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="1.8"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022 23.848 23.848 0 005.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"
                        />
                    </svg>

                </div>

                <h2>
                    هێشتا ئاگەهداری نینن
                </h2>

                <p>
                    دەمێ ئاگەهدارییەکا نوو هەبیت، ل ڤێرێ دێ بۆ تە دیار بیت.
                </p>

            </div>

        </div>

    </div>


    <script>

        /*
         * For now this page intentionally has no
         * fake notifications and no Firebase fetch.
         *
         * Later we can connect this container to
         * real alerts from Firebase.
         */

        function markAsRead(
            cardElement
        ) {

            if (
                !cardElement ||
                !cardElement.classList.contains(
                    "unread"
                )
            ) {
                return;
            }

            cardElement.classList.remove(
                "unread"
            );

            const dot =
                cardElement.querySelector(
                    ".unread-dot"
                );

            if (dot) {
                dot.remove();
            }

        }

        window.markAsRead =
            markAsRead;

    </script>

</body>
</html>
