<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>بەکارهێنەرێن ئۆفیسێ</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

<style>

* {
  box-sizing: border-box;
}

:root {
  --orange: #ff8500;
  --orange-dark: #e86f00;
  --orange-soft: #fff4e8;

  --dark: #0f172a;
  --text: #334155;
  --muted: #64748b;

  --background: #f6f8fb;
  --white: #ffffff;
  --border: #e7ecf2;

  --green: #059669;
  --green-soft: #ecfdf5;

  --red: #dc2626;
  --red-soft: #fef2f2;

  --blue: #2563eb;
  --blue-soft: #eff6ff;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family:
    "Segoe UI",
    Tahoma,
    sans-serif;

  background: var(--background);
  color: var(--dark);
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}


/* =========================================
   CONTAINER
========================================= */

.container {
  width: min(1180px, 100%);
  margin: auto;

  padding:
    35px
    24px
    60px;
}


/* =========================================
   HEADER
========================================= */

.header {
  display: flex;
  align-items: center;

  gap: 16px;

  margin-bottom: 28px;
}

.back-btn {
  width: 55px;
  height: 55px;

  flex: 0 0 auto;

  border: 0;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--orange-soft);
  color: var(--orange-dark);

  font-size: 21px;

  transition: .2s ease;
}

.back-btn:hover {
  background: var(--orange);
  color: #fff;

  transform: translateY(-2px);
}

.header-text {
  min-width: 0;
}

.header h1 {
  margin:
    0
    0
    7px;

  font-size: 32px;
  font-weight: 900;
}

.header p {
  margin: 0;

  color: var(--muted);

  font-size: 16px;
  font-weight: 600;
}


/* =========================================
   CARD
========================================= */

.card {
  margin-bottom: 24px;

  padding: 28px;

  background: #fff;

  border:
    1px
    solid
    var(--border);

  border-radius: 27px;

  box-shadow:
    0
    12px
    32px
    rgba(15, 23, 42, .05);
}

.card-title {
  display: flex;
  align-items: center;

  gap: 12px;

  margin:
    0
    0
    25px;

  font-size: 23px;
  font-weight: 900;
}

.title-icon {
  width: 45px;
  height: 45px;

  flex: 0 0 auto;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--orange-soft);
  color: var(--orange-dark);
}


/* =========================================
   FORM
========================================= */

.form-grid {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 18px;
}

.form-group label {
  display: flex;
  align-items: center;

  gap: 8px;

  margin-bottom: 9px;

  color: var(--text);

  font-size: 15px;
  font-weight: 800;
}

.form-group label i {
  color: var(--orange);
}

.input-wrapper {
  position: relative;
}

.input-icon {
  position: absolute;

  top: 50%;
  right: 16px;

  transform: translateY(-50%);

  color: #94a3b8;

  pointer-events: none;
}

.form-group input,
.form-group select {
  width: 100%;
  height: 58px;

  padding:
    0
    46px
    0
    16px;

  border:
    1.5px
    solid
    #dfe5ec;

  border-radius: 17px;

  background: #f8fafc;
  color: var(--dark);

  outline: none;

  transition: .2s ease;
}

.form-group input:focus,
.form-group select:focus {
  border-color: var(--orange);

  background: #fff;

  box-shadow:
    0
    0
    0
    4px
    rgba(255, 133, 0, .08);
}


/* =========================================
   PASSWORD
========================================= */

.password-wrapper {
  position: relative;
}

.password-wrapper input {
  padding-left: 55px;
}

.eye-btn {
  position: absolute;

  left: 9px;
  top: 50%;

  transform: translateY(-50%);

  width: 42px;
  height: 42px;

  border: 0;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: transparent;
  color: #64748b;
}

.eye-btn:hover {
  background: var(--orange-soft);
  color: var(--orange-dark);
}


/* =========================================
   CREATE BUTTON
========================================= */

.create-btn {
  min-width: 225px;
  min-height: 57px;

  margin-top: 23px;

  padding:
    14px
    26px;

  border: 0;
  border-radius: 18px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  gap: 10px;

  background:
    linear-gradient(
      135deg,
      #ff9b20,
      #ff7400
    );

  color: #fff;

  font-size: 17px;
  font-weight: 900;

  box-shadow:
    0
    12px
    26px
    rgba(255, 116, 0, .22);
}

.create-btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}


/* =========================================
   MESSAGE
========================================= */

.message {
  display: none;

  margin-top: 18px;

  padding:
    15px
    17px;

  border-radius: 15px;

  font-size: 14px;
  font-weight: 800;
}

.message.success {
  display: flex;
  align-items: center;

  gap: 9px;

  background: var(--green-soft);
  color: #047857;

  border:
    1px
    solid
    #a7f3d0;
}

.message.error {
  display: flex;
  align-items: center;

  gap: 9px;

  background: var(--red-soft);
  color: var(--red);

  border:
    1px
    solid
    #fecaca;
}


/* =========================================
   TABLE
========================================= */

.table-wrapper {
  width: 100%;

  overflow-x: auto;

  border:
    1px
    solid
    var(--border);

  border-radius: 20px;
}

table {
  width: 100%;

  min-width: 900px;

  border-collapse: collapse;
}

th,
td {
  padding:
    17px
    16px;

  text-align: right;

  border-bottom:
    1px
    solid
    #edf1f5;

  vertical-align: middle;
}

th {
  background: #f8fafc;

  color: var(--muted);

  font-size: 14px;
  font-weight: 850;
}

th i {
  margin-left: 6px;

  color: var(--orange);
}

td {
  color: var(--text);

  font-size: 15px;
  font-weight: 600;
}

tbody tr:hover {
  background: #fffaf5;
}


/* =========================================
   USER
========================================= */

.user-cell {
  display: flex;
  align-items: center;

  gap: 11px;
}

.user-avatar {
  width: 42px;
  height: 42px;

  flex: 0 0 auto;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--orange-soft);
  color: var(--orange-dark);
}

.user-name {
  color: var(--dark);

  font-weight: 850;
}

.email {
  direction: ltr;
  text-align: right;

  color: var(--muted);
}


/* =========================================
   BADGES
========================================= */

.role-badge {
  display: inline-flex;
  align-items: center;

  gap: 6px;

  padding:
    7px
    11px;

  border-radius: 999px;

  background: var(--blue-soft);
  color: var(--blue);

  font-size: 12px;
  font-weight: 850;
}

.status {
  display: inline-flex;
  align-items: center;

  gap: 7px;

  padding:
    7px
    12px;

  border-radius: 999px;

  font-size: 12px;
  font-weight: 850;
}

.status.active {
  background: var(--green-soft);
  color: var(--green);
}

.status.inactive {
  background: var(--red-soft);
  color: var(--red);
}

.status-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: currentColor;
}

.row-number {
  width: 37px;
  height: 37px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: #f1f5f9;

  font-weight: 900;
}


/* =========================================
   ACTION BUTTONS
========================================= */

.actions {
  display: flex;
  align-items: center;

  gap: 8px;
}

.action-btn {
  width: 40px;
  height: 40px;

  border: 0;
  border-radius: 50%;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  transition: .2s ease;
}

.edit-btn {
  background: var(--blue-soft);
  color: var(--blue);
}

.edit-btn:hover {
  background: var(--blue);
  color: #fff;

  transform: translateY(-2px);
}

.delete-btn {
  background: var(--red-soft);
  color: var(--red);
}

.delete-btn:hover {
  background: var(--red);
  color: #fff;

  transform: translateY(-2px);
}


/* =========================================
   EMPTY
========================================= */

.empty {
  padding: 45px !important;

  text-align: center !important;

  color: #94a3b8;
}

.empty i {
  display: block;

  margin-bottom: 12px;

  color: var(--orange);

  font-size: 35px;
}


/* =========================================
   MODAL
========================================= */

.modal {
  position: fixed;

  inset: 0;

  z-index: 5000;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    rgba(15, 23, 42, .52);

  backdrop-filter:
    blur(6px);
}

.modal.active {
  display: flex;
}

.modal-card {
  position: relative;

  width:
    min(
      520px,
      100%
    );

  max-height: 90vh;

  overflow-y: auto;

  padding: 30px;

  border-radius: 28px;

  background: #fff;

  box-shadow:
    0
    30px
    70px
    rgba(0, 0, 0, .22);
}

.modal-close {
  position: absolute;

  top: 17px;
  left: 17px;

  width: 40px;
  height: 40px;

  border: 0;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #f1f5f9;
  color: #64748b;
}

.modal-icon {
  width: 62px;
  height: 62px;

  margin-bottom: 18px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--orange-soft);
  color: var(--orange-dark);

  font-size: 24px;
}

.modal-icon.delete {
  background: var(--red-soft);
  color: var(--red);
}

.modal-title {
  margin:
    0
    0
    22px;

  font-size: 24px;
  font-weight: 900;
}

.modal-text {
  margin:
    -10px
    0
    22px;

  color: var(--muted);

  line-height: 1.8;
}

.modal-actions {
  display: flex;

  gap: 10px;

  margin-top: 23px;
}

.modal-actions button {
  flex: 1;

  min-height: 52px;

  border: 0;
  border-radius: 16px;

  font-weight: 900;
}

.cancel-btn {
  background: #f1f5f9;
  color: #475569;
}

.save-btn {
  background: var(--orange);
  color: #fff;
}

.danger-btn {
  background: var(--red);
  color: #fff;
}

.modal-actions button:disabled {
  opacity: .6;
  cursor: not-allowed;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width: 760px) {

  .container {
    padding:
      20px
      15px
      40px;
  }

  .header {
    align-items: flex-start;
  }

  .back-btn {
    width: 48px;
    height: 48px;
  }

  .header h1 {
    font-size: 24px;
  }

  .header p {
    font-size: 13px;
  }

  .card {
    padding: 20px;

    border-radius: 22px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .create-btn {
    width: 100%;
  }

  .modal-card {
    padding:
      26px
      20px;
  }

}


/* =========================================
   DESKTOP
========================================= */

@media(min-width: 1024px) {

  .container {
    padding:
      45px
      30px
      70px;
  }

  .header h1 {
    font-size: 36px;
  }

  .header p {
    font-size: 18px;
  }

  .card {
    padding: 34px;
  }

  .card-title {
    font-size: 27px;
  }

  td {
    font-size: 16px;
  }

}

</style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <button
      type="button"
      class="back-btn"
      id="backBtn"
      title="زڤرین"
    >

      <i class="fa-solid fa-arrow-right"></i>

    </button>


    <div class="header-text">

      <h1>
        بەکارهێنەرێن ئۆفیسێ
      </h1>

      <p>
        دروستکرن، دەستکاریکرن و ژێبرنا هەژمارێن کارمەندان
      </p>

    </div>

  </div>



  <!-- CREATE -->

  <section class="card">

    <h2 class="card-title">

      <span class="title-icon">
        <i class="fa-solid fa-user-plus"></i>
      </span>

      دروستکرنا بەکارهێنەرێ نووی

    </h2>


    <form id="userForm">


      <div class="form-grid">


        <div class="form-group">

          <label for="name">

            <i class="fa-solid fa-user"></i>
            ناڤ

          </label>


          <div class="input-wrapper">

            

            <input
              type="text"
              id="name"
              required
              autocomplete="off"
              placeholder="ناڤێ کارمەندی"
            >

          </div>

        </div>



        <div class="form-group">

          <label for="email">

            <i class="fa-solid fa-envelope"></i>
            ئیمەیڵ

          </label>


          <div class="input-wrapper">

           

            <input
              type="email"
              id="email"
              required
              autocomplete="off"
              placeholder="user@office.com"
              dir="ltr"
            >

          </div>

        </div>



        <div class="form-group">

          <label for="password">

            <i class="fa-solid fa-lock"></i>
            پەیڤا نهێنی

          </label>


          <div class="password-wrapper">

           

            <input
              type="password"
              id="password"
              minlength="6"
              required
              autocomplete="new-password"
              placeholder="پەیڤا نهێنی"
            >


            <button
              type="button"
              class="eye-btn"
              id="eyeBtn"
            >

              <i
                class="fa-regular fa-eye"
                id="eyeIcon"
              ></i>

            </button>

          </div>

        </div>


      </div>


      <button
        type="submit"
        class="create-btn"
        id="createBtn"
      >

        <i class="fa-solid fa-user-plus"></i>

        <span id="createBtnText">
          دروستکرنا بەکارهێنەری
        </span>

      </button>


      <div
        class="message"
        id="message"
      ></div>


    </form>

  </section>



  <!-- USERS -->

  <section class="card">


    <h2 class="card-title">

      <span class="title-icon">
        <i class="fa-solid fa-users"></i>
      </span>

      بەکارهێنەرێن تومارکری

    </h2>


    <div class="table-wrapper">


      <table>


        <thead>

          <tr>

            <th>#</th>

            <th>
              <i class="fa-solid fa-user"></i>
              ناڤ
            </th>

            <th>
              <i class="fa-solid fa-envelope"></i>
              ئیمەیڵ
            </th>

            <th>
              <i class="fa-solid fa-user-shield"></i>
              رول
            </th>

            <th>
              <i class="fa-solid fa-circle-check"></i>
              بارودۆخ
            </th>

            <th>
              <i class="fa-solid fa-sliders"></i>
              کردار
            </th>

          </tr>

        </thead>


        <tbody id="usersTable">

          <tr>

            <td
              colspan="6"
              class="empty"
            >

              <i class="fa-solid fa-spinner fa-spin"></i>

              چاڤەرێ بە...

            </td>

          </tr>

        </tbody>


      </table>


    </div>

  </section>


</div>



<!-- =========================================
     EDIT MODAL
========================================= -->

<div
  class="modal"
  id="editModal"
>

  <div class="modal-card">


    <button
      type="button"
      class="modal-close"
      id="closeEditModal"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>


    <div class="modal-icon">

      <i class="fa-solid fa-user-pen"></i>

    </div>


    <h2 class="modal-title">
      دەستکاریکرنا بەکارهێنەری
    </h2>


    <div class="form-group">

      <label for="editName">

        <i class="fa-solid fa-user"></i>
        ناڤ

      </label>


      <div class="input-wrapper">

        <i class="fa-solid fa-user input-icon"></i>

        <input
          id="editName"
          type="text"
          placeholder="ناڤ"
        >

      </div>

    </div>


    <div
      class="form-group"
      style="margin-top:17px;"
    >

      <label for="editEmail">

        <i class="fa-solid fa-envelope"></i>
        ئیمەیڵ

      </label>


      <div class="input-wrapper">

        <i class="fa-solid fa-envelope input-icon"></i>

        <input
          id="editEmail"
          type="email"
          dir="ltr"
          readonly
        >

      </div>

    </div>


    <div
      class="form-group"
      style="margin-top:17px;"
    >

      <label for="editActive">

        <i class="fa-solid fa-circle-check"></i>
        بارودۆخ

      </label>


      <div class="input-wrapper">

        <i class="fa-solid fa-toggle-on input-icon"></i>

        <select id="editActive">

          <option value="true">
            چالاک
          </option>

          <option value="false">
            راگرتی
          </option>

        </select>

      </div>

    </div>


    <div class="modal-actions">


      <button
        type="button"
        class="cancel-btn"
        id="cancelEditBtn"
      >
        پاشگەزبوون
      </button>


      <button
        type="button"
        class="save-btn"
        id="saveEditBtn"
      >

        <i class="fa-solid fa-floppy-disk"></i>

        خەزنکرن

      </button>


    </div>


  </div>

</div>



<!-- =========================================
     DELETE MODAL
========================================= -->

<div
  class="modal"
  id="deleteModal"
>

  <div class="modal-card">


    <button
      type="button"
      class="modal-close"
      id="closeDeleteModal"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>


    <div class="modal-icon delete">

      <i class="fa-solid fa-trash"></i>

    </div>


    <h2 class="modal-title">
      ژێبرنا بەکارهێنەری
    </h2>


    <p
      class="modal-text"
      id="deleteText"
    >
      تو پشتراستی؟
    </p>


    <div class="modal-actions">


      <button
        type="button"
        class="cancel-btn"
        id="cancelDeleteBtn"
      >
        نەخێر
      </button>


      <button
        type="button"
        class="danger-btn"
        id="confirmDeleteBtn"
      >

        <i class="fa-solid fa-trash"></i>

        بەلێ، ژێ ببە

      </button>


    </div>


  </div>

</div>

/* =========================================

const nameInput =
  document.getElementById(

  );


const emailInput =
  document.getElementById(
    "email"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const createBtn =
  document.getElementById(
    "createBtn"
  );


const createBtnText =
  document.getElementById(
    "createBtnText"
  );


const message =
  document.getElementById(
    "message"
  );


const usersTable =
  document.getElementById(
    "usersTable"
  );


const eyeBtn =
  document.getElementById(
    "eyeBtn"
  );


const eyeIcon =
  document.getElementById(
    "eyeIcon"
  );


const backBtn =
  document.getElementById(
    "backBtn"
  );


/* EDIT */

const editModal =
  document.getElementById(
    "editModal"
  );


const closeEditModal =
  document.getElementById(
    "closeEditModal"
  );


const cancelEditBtn =
  document.getElementById(
    "cancelEditBtn"
  );


const saveEditBtn =
  document.getElementById(
    "saveEditBtn"
  );


const editName =
  document.getElementById(
    "editName"
  );


const editEmail =
  document.getElementById(
    "editEmail"
  );


const editActive =
  document.getElementById(
    "editActive"
  );


/* DELETE */

const deleteModal =
  document.getElementById(
    "deleteModal"
  );


const closeDeleteModal =
  document.getElementById(
    "closeDeleteModal"
  );


const cancelDeleteBtn =
  document.getElementById(
    "cancelDeleteBtn"
  );


const confirmDeleteBtn =
  document.getElementById(
    "confirmDeleteBtn"
  );


const deleteText =
  document.getElementById(
    "deleteText"
  );


/* =========================================
   STATE
========================================= */

let usersListenerStarted =
  false;


let usersCache =
  {};


let selectedEditUid =
  null;


let selectedDeleteUid =
  null;


/* =========================================
   BACK
========================================= */

backBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      ADMIN_DASHBOARD_URL;

  }
);


/* =========================================
   OWNER CHECK
========================================= */

onAuthStateChanged(
  auth,
  async owner => {


    if (!owner) {

      window.location.replace(
        ADMIN_LOGIN_URL
      );

      return;
    }


    try {

      const ownerSnapshot =
        await get(

          ref(
            database,
            `users/${owner.uid}`
          )

        );


      if (
        !ownerSnapshot.exists()
      ) {

        await signOut(
          auth
        );


        window.location.replace(
          ADMIN_LOGIN_URL
        );


        return;
      }


      const ownerData =
        ownerSnapshot.val();


      if (
        String(
          ownerData.role || ""
        ).toLowerCase() !==
        "owner"

        ||

        ownerData.active ===
        false
      ) {

        await signOut(
          auth
        );


        window.location.replace(
          ADMIN_LOGIN_URL
        );


        return;
      }


      startUsersListener();

    }
    catch(error) {

      console.error(
        "Owner verification error:",
        error
      );


      showMessage(
        "هەڵە د پشکنینا هەژمارێ رێڤەبەری.",
        "error"
      );

    }

  }
);


/* =========================================
   CREATE USER
========================================= */

userForm.addEventListener(
  "submit",
  async event => {


    event.preventDefault();


    clearMessage();


    const name =
      nameInput.value
        .trim();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    const password =
      passwordInput.value;


    if (
      !name ||
      !email ||
      !password
    ) {

      showMessage(
        "هیڤیە هەمی خانەیان پڕ بکە.",
        "error"
      );


      return;
    }


    if (
      password.length < 6
    ) {

      showMessage(
        "پەیڤا نهێنی کێمترین 6 پیت بیت.",
        "error"
      );


      return;
    }


    if (
      !auth.currentUser
    ) {

      showMessage(
        "هەژمارێ رێڤەبەری نەهاتە ناسین.",
        "error"
      );


      return;
    }


    createBtn.disabled =
      true;


    createBtnText.textContent =
      "چاڤەرێ بە...";


    try {

      const userCredential =
        await createUserWithEmailAndPassword(

          creatorAuth,

          email,

          password

        );


      const newUser =
        userCredential.user;


      await set(

        ref(
          database,
          `users/${newUser.uid}`
        ),

        {

          name,

          email,

          role:
            "user",

          active:
            true,

          createdBy:
            auth.currentUser.uid,

          createdAt:
            serverTimestamp()

        }

      );


      await signOut(
        creatorAuth
      );


      userForm.reset();


      passwordInput.type =
        "password";


      eyeIcon.className =
        "fa-regular fa-eye";


      showMessage(
        "بەکارهێنەر ب سەرکەفتی هات دروستکرن.",
        "success"
      );

    }
    catch(error) {

      console.error(
        "Create user error:",
        error
      );


      let text =
        "هەڵەیەک روو دا.";


      if (
        error.code ===
        "auth/email-already-in-use"
      ) {

        text =
          "ئەڤ ئیمەیڵە ژ بەری نوکە هاتیە بکارئینان.";

      }


      else if (
        error.code ===
        "auth/invalid-email"
      ) {

        text =
          "ئیمەیلا داخلکری یا دروست نینە.";

      }


      else if (
        error.code ===
        "auth/weak-password"
      ) {

        text =
          "پەیڤا نهێنی زەعیفە.";

      }


      else if (
        error.code ===
        "database/permission-denied"
      ) {

        text =
          "دەستهەلاتا نووسینێ د Database دا نینە.";

      }


      showMessage(
        text,
        "error"
      );

    }
    finally {

      createBtn.disabled =
        false;


      createBtnText.textContent =
        "دروستکرنا بەکارهێنەری";

    }

  }
);


/* =========================================
   USERS LISTENER
========================================= */

function startUsersListener() {


  if (
    usersListenerStarted
  ) {

    return;
  }


  usersListenerStarted =
    true;


  onValue(

    ref(
      database,
      "users"
    ),

    snapshot => {


      usersCache =
        snapshot.exists()
          ?
          snapshot.val() || {}
          :
          {};


      renderUsers();

    },

    error => {

      console.error(
        "Users listener error:",
        error
      );


      usersTable.innerHTML = `

        <tr>

          <td
            colspan="6"
            class="empty"
          >

            <i class="fa-solid fa-triangle-exclamation"></i>

            هەڵە د بارکرنا بەکارهێنەران

          </td>

        </tr>

      `;

    }

  );

}


/* =========================================
   RENDER USERS
========================================= */

function renderUsers() {

  usersTable.innerHTML =
    "";


  const users =
    Object.entries(
      usersCache
    )

    .map(
      ([uid, user]) => ({
        uid,
        ...(user || {})
      })
    )

    .filter(
      user =>

        String(
          user.role || ""
        ).toLowerCase() ===
        "user"
    )

    .sort(
      (a, b) =>

        String(
          a.name || ""
        )

        .localeCompare(
          String(
            b.name || ""
          )
        )
    );


  if (
    users.length === 0
  ) {

    renderEmptyUsers();

    return;
  }


  users.forEach(
    (
      user,
      index
    ) => {


      const active =
        user.active !== false;


      const row =
        document.createElement(
          "tr"
        );


      row.innerHTML = `

        <td>

          <span class="row-number">
            ${index + 1}
          </span>

        </td>


        <td>

          <div class="user-cell">

            <div class="user-avatar">

              <i class="fa-solid fa-user"></i>

            </div>


            <div class="user-name">

              ${escapeHTML(
                user.name || "-"
              )}

            </div>

          </div>

        </td>


        <td class="email">

          ${escapeHTML(
            user.email || "-"
          )}

        </td>


        <td>

          <span class="role-badge">

            <i class="fa-solid fa-user"></i>

            User

          </span>

        </td>


        <td>

          <span
            class="
              status
              ${
                active
                  ?
                  "active"
                  :
                  "inactive"
              }
            "
          >

            <span class="status-dot"></span>

            ${
              active
                ?
                "چالاک"
                :
                "راگرتی"
            }

          </span>

        </td>


        <td>

          <div class="actions">


            <button
              type="button"
              class="action-btn edit-btn"
              data-edit="${escapeHTML(
                user.uid
              )}"
              title="دەستکاریکرن"
            >

              <i class="fa-solid fa-pen"></i>

            </button>


            <button
              type="button"
              class="action-btn delete-btn"
              data-delete="${escapeHTML(
                user.uid
              )}"
              title="ژێبرن"
            >

              <i class="fa-solid fa-trash"></i>

            </button>


          </div>

        </td>

      `;


      usersTable.appendChild(
        row
      );

    }
  );


  /* EDIT BUTTONS */

  usersTable
    .querySelectorAll(
      "[data-edit]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            openEditModal(
              button.dataset.edit
            );

          }
        );

      }
    );


  /* DELETE BUTTONS */

  usersTable
    .querySelectorAll(
      "[data-delete]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            openDeleteModal(
              button.dataset.delete
            );

          }
        );

      }
    );

}


/* =========================================
   EMPTY
========================================= */

function renderEmptyUsers() {

  usersTable.innerHTML = `

    <tr>

      <td
        colspan="6"
        class="empty"
      >

        <i class="fa-solid fa-users-slash"></i>

        هێشتا بەکارهێنەر نەهاتیە دروستکرن

      </td>

    </tr>

  `;

}


/* =========================================
   OPEN EDIT
========================================= */

function openEditModal(
  uid
) {

  const user =
    usersCache[uid];


  if (!user) {

    return;
  }


  selectedEditUid =
    uid;


  editName.value =
    user.name ||
    "";


  editEmail.value =
    user.email ||
    "";


  editActive.value =
    user.active === false
      ?
      "false"
      :
      "true";


  editModal.classList.add(
    "active"
  );


  setTimeout(
    () => {

      editName.focus();

    },
    100
  );

}


/* =========================================
   SAVE EDIT
========================================= */

saveEditBtn.addEventListener(
  "click",
  async () => {


    if (
      !selectedEditUid
    ) {

      return;
    }


    const name =
      editName.value
        .trim();


    const active =
      editActive.value ===
      "true";


    if (!name) {

      alert(
        "ناڤێ بەکارهێنەری بنڤیسە."
      );


      return;
    }


    saveEditBtn.disabled =
      true;


    try {

      await update(

        ref(
          database,
          `users/${selectedEditUid}`
        ),

        {

          name,

          active,

          updatedAt:
            serverTimestamp()

        }

      );


      closeEdit();


      showMessage(
        "زانیاریێن بەکارهێنەری ب سەرکەفتی هاتنە دەستکاریکرن.",
        "success"
      );

    }
    catch(error) {

      console.error(
        "Edit user error:",
        error
      );


      showMessage(
        "دەستکاریکرنا بەکارهێنەری سەرنەکەفت.",
        "error"
      );

    }
    finally {

      saveEditBtn.disabled =
        false;

    }

  }
);


/* =========================================
   CLOSE EDIT
========================================= */

function closeEdit() {

  selectedEditUid =
    null;


  editModal.classList.remove(
    "active"
  );

}


closeEditModal.addEventListener(
  "click",
  closeEdit
);


cancelEditBtn.addEventListener(
  "click",
  closeEdit
);


editModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      editModal
    ) {

      closeEdit();

    }

  }
);


/* =========================================
   OPEN DELETE
========================================= */

function openDeleteModal(
  uid
) {

  const user =
    usersCache[uid];


  if (!user) {

    return;
  }


  selectedDeleteUid =
    uid;


  deleteText.textContent =
    `تو پشتراستی دڤێت بەکارهێنەر "${user.name || "بەکارهێنەر"}" ژێ ببەی؟`;


  deleteModal.classList.add(
    "active"
  );

}


/* =========================================
   DELETE
========================================= */

confirmDeleteBtn.addEventListener(
  "click",
  async () => {


    if (
      !selectedDeleteUid
    ) {

      return;
    }


    confirmDeleteBtn.disabled =
      true;


    try {

      /*
       * IMPORTANT:
       *
       * This removes the user's Office
       * profile from Realtime Database.
       *
       * Your login system requires this
       * profile, so this user can no
       * longer enter the Office system.
       *
       * Firebase Authentication account
       * itself needs Firebase Admin SDK
       * for permanent deletion.
       */

      await remove(

        ref(
          database,
          `users/${selectedDeleteUid}`
        )

      );


      closeDelete();


      showMessage(
        "بەکارهێنەر ژ سیستەمی هاتە ژێبرن.",
        "success"
      );

    }
    catch(error) {

      console.error(
        "Delete user error:",
        error
      );


      showMessage(
        "ژێبرنا بەکارهێنەری سەرنەکەفت.",
        "error"
      );

    }
    finally {

      confirmDeleteBtn.disabled =
        false;

    }

  }
);


/* =========================================
   CLOSE DELETE
========================================= */

function closeDelete() {

  selectedDeleteUid =
    null;


  deleteModal.classList.remove(
    "active"
  );

}


closeDeleteModal.addEventListener(
  "click",
  closeDelete
);


cancelDeleteBtn.addEventListener(
  "click",
  closeDelete
);


deleteModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      deleteModal
    ) {

      closeDelete();

    }

  }
);


/* =========================================
   ESC CLOSE
========================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Escape"
    ) {

      closeEdit();

      closeDelete();

    }

  }
);


/* =========================================
   PASSWORD
========================================= */

eyeBtn.addEventListener(
  "click",
  () => {


    const hidden =
      passwordInput.type ===
      "password";


    passwordInput.type =
      hidden
        ?
        "text"
        :
        "password";


    eyeIcon.className =
      hidden
        ?
        "fa-regular fa-eye-slash"
        :
        "fa-regular fa-eye";

  }
);


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type
) {

  const icon =
    type === "success"
      ?
      "fa-circle-check"
      :
      "fa-circle-exclamation";


  message.innerHTML = `

    <i class="fa-solid ${icon}"></i>

    <span>
      ${escapeHTML(text)}
    </span>

  `;


  message.className =
    `message ${type}`;


  setTimeout(
    () => {

      clearMessage();

    },
    4000
  );

}


function clearMessage() {

  message.innerHTML =
    "";


  message.className =
    "message";

}


/* =========================================
   SAFE HTML
========================================= */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}

</script>
