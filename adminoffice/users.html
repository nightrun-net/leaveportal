<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Office</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

<style>

* {
  box-sizing: border-box;
}

:root {
  --orange: #ff8500;
  --orange-dark: #e86f00;
  --orange-soft: #fff4e8;

  --dark: #0f172a;
  --text: #334155;
  --muted: #64748b;

  --background: #f6f8fb;
  --white: #ffffff;
  --border: #e7ecf2;

  --green: #059669;
  --green-soft: #ecfdf5;

  --red: #dc2626;
  --red-soft: #fef2f2;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family:
    "Segoe UI",
    Tahoma,
    sans-serif;

  background: var(--background);
  color: var(--dark);

  -webkit-tap-highlight-color: transparent;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}




.container {
  width: min(1150px, 100%);
  margin: auto;

  padding:
    35px
    24px
    60px;
}




.header {
  display: flex;
  align-items: center;

  gap: 16px;

  margin-bottom: 28px;
}

.back-btn {
  width: 55px;
  height: 55px;

  flex: 0 0 auto;

  border: 0;
  border-radius: 17px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--orange-soft);
  color: var(--orange-dark);

  font-size: 21px;

  transition: .2s ease;
}

.back-btn:hover {
  background: var(--orange);
  color: #fff;

  transform: translateY(-2px);
}

.header-text {
  min-width: 0;
}

.header h1 {
  margin:
    0
    0
    7px;

  font-size: 32px;
  font-weight: 900;

  color: var(--dark);
}

.header p {
  margin: 0;

  color: var(--muted);

  font-size: 16px;
  font-weight: 600;

  line-height: 1.7;
}




.card {
  margin-bottom: 24px;

  padding: 28px;

  background: var(--white);

  border:
    1px
    solid
    var(--border);

  border-radius: 27px;

  box-shadow:
    0
    12px
    32px
    rgba(15, 23, 42, .05);
}

.card-title {
  display: flex;
  align-items: center;

  gap: 12px;

  margin:
    0
    0
    25px;

  font-size: 23px;
  font-weight: 900;

  color: var(--dark);
}

.title-icon {
  width: 45px;
  height: 45px;

  flex: 0 0 auto;

  border-radius: 15px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--orange-soft);
  color: var(--orange-dark);

  font-size: 19px;
}




.form-grid {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 18px;
}

.form-group label {
  display: flex;
  align-items: center;

  gap: 8px;

  margin-bottom: 9px;

  font-size: 15px;
  font-weight: 800;

  color: var(--text);
}

.form-group label i {
  width: 21px;

  color: var(--orange);

  text-align: center;
}

.input-wrapper {
  position: relative;
}

.input-icon {
  position: absolute;

  top: 50%;
  right: 16px;

  transform: translateY(-50%);

  color: #94a3b8;

  font-size: 16px;

  pointer-events: none;
}

.form-group input {
  width: 100%;
  height: 58px;

  padding:
    0
    46px
    0
    16px;

  border:
    1.5px
    solid
    #dfe5ec;

  border-radius: 17px;

  background: #f8fafc;
  color: var(--dark);

  outline: none;

  font-size: 16px;

  transition: .2s ease;
}

.form-group input:focus {
  border-color: var(--orange);

  background: #fff;

  box-shadow:
    0
    0
    0
    4px
    rgba(255, 133, 0, .08);
}

.form-group input::placeholder {
  color: #a0aaba;
}




.password-wrapper {
  position: relative;
}

.password-wrapper input {
  padding-left: 55px;
}

.eye-btn {
  position: absolute;

  left: 9px;
  top: 50%;

  transform: translateY(-50%);

  width: 42px;
  height: 42px;

  border: 0;
  border-radius: 13px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: transparent;
  color: #64748b;

  font-size: 17px;

  transition: .2s ease;
}

.eye-btn:hover {
  background: var(--orange-soft);
  color: var(--orange-dark);
}




.create-btn {
  min-width: 220px;
  min-height: 57px;

  margin-top: 23px;

  padding:
    14px
    26px;

  border: 0;
  border-radius: 18px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  gap: 10px;

  background:
    linear-gradient(
      135deg,
      #ff9b20,
      #ff7400
    );

  color: #fff;

  font-size: 17px;
  font-weight: 900;

  box-shadow:
    0
    12px
    26px
    rgba(255, 116, 0, .22);

  transition: .2s ease;
}

.create-btn:hover {
  transform: translateY(-2px);

  box-shadow:
    0
    16px
    30px
    rgba(255, 116, 0, .27);
}

.create-btn:disabled {
  opacity: .6;

  cursor: not-allowed;

  transform: none;
}




.message {
  display: none;

  margin-top: 18px;

  padding:
    15px
    17px;

  border-radius: 15px;

  font-size: 14px;
  font-weight: 800;
}

.message.success {
  display: flex;
  align-items: center;

  gap: 9px;

  background: var(--green-soft);
  color: #047857;

  border:
    1px
    solid
    #a7f3d0;
}

.message.error {
  display: flex;
  align-items: center;

  gap: 9px;

  background: var(--red-soft);
  color: var(--red);

  border:
    1px
    solid
    #fecaca;
}




.table-wrapper {
  width: 100%;

  overflow-x: auto;

  border:
    1px
    solid
    var(--border);

  border-radius: 20px;
}

table {
  width: 100%;

  min-width: 780px;

  border-collapse: collapse;

  background: #fff;
}

th,
td {
  padding:
    17px
    16px;

  text-align: right;

  border-bottom:
    1px
    solid
    #edf1f5;

  vertical-align: middle;
}

th {
  background: #f8fafc;

  color: var(--muted);

  font-size: 14px;
  font-weight: 850;
}

th i {
  margin-left: 6px;

  color: var(--orange);
}

td {
  color: var(--text);

  font-size: 15px;
  font-weight: 600;
}

tbody tr {
  transition: .2s ease;
}

tbody tr:hover {
  background: #fffaf5;
}

tbody tr:last-child td {
  border-bottom: 0;
}




.user-cell {
  display: flex;
  align-items: center;

  gap: 11px;
}

.user-avatar {
  width: 42px;
  height: 42px;

  flex: 0 0 auto;

  border-radius: 14px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--orange-soft);
  color: var(--orange-dark);

  font-size: 16px;
}

.user-name {
  color: var(--dark);

  font-weight: 850;
}




.email {
  direction: ltr;

  text-align: right;

  color: var(--muted);
}

.email i {
  margin-right: 7px;

  color: #94a3b8;
}




.role-badge {
  display: inline-flex;
  align-items: center;

  gap: 6px;

  padding:
    7px
    11px;

  border-radius: 100px;

  background: #eff6ff;
  color: #2563eb;

  font-size: 12px;
  font-weight: 850;
}




.status {
  display: inline-flex;
  align-items: center;

  gap: 7px;

  padding:
    7px
    12px;

  border-radius: 100px;

  font-size: 12px;
  font-weight: 850;
}

.status.active {
  background: var(--green-soft);
  color: var(--green);
}

.status.inactive {
  background: var(--red-soft);
  color: var(--red);
}

.status-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: currentColor;
}




.row-number {
  width: 37px;
  height: 37px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  border-radius: 12px;

  background: #f1f5f9;

  color: #475569;

  font-weight: 900;

  direction: ltr;
}




.empty {
  padding: 45px !important;

  text-align: center !important;

  color: #94a3b8;

  font-size: 15px;
}

.empty i {
  display: block;

  margin-bottom: 12px;

  color: var(--orange);

  font-size: 35px;
}




@media(max-width: 760px) {

  .container {
    padding:
      20px
      15px
      40px;
  }

  .header {
    align-items: flex-start;

    margin-bottom: 22px;
  }

  .back-btn {
    width: 48px;
    height: 48px;

    border-radius: 15px;
  }

  .header h1 {
    font-size: 24px;
  }

  .header p {
    font-size: 13px;
  }

  .card {
    padding: 20px;

    border-radius: 22px;
  }

  .card-title {
    font-size: 20px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .create-btn {
    width: 100%;
  }

}




@media(min-width: 1024px) {

  .container {
    padding:
      45px
      30px
      70px;
  }

  .header h1 {
    font-size: 36px;
  }

  .header p {
    font-size: 18px;
  }

  .card {
    padding: 34px;
  }

  .card-title {
    font-size: 27px;
  }

  .form-group label {
    font-size: 17px;
  }

  .form-group input {
    height: 62px;

    font-size: 17px;
  }

  th {
    font-size: 15px;
  }

  td {
    font-size: 16px;
  }

}

</style>

</head>


<body>


<div class="container">




  <div class="header">


    <button
      type="button"
      class="back-btn"
      id="backBtn"
      aria-label="زڤرین"
      title="زڤرین"
    >

      <i class="fa-solid fa-arrow-right"></i>

    </button>


    <div class="header-text">

      <h1>
        بکارهێنەرێن ئۆفیسێ
      </h1>

      <p>
        دروستکرنا هەژمارێن کارمەندان و دیتنا بکارهێنەرێن تومارکری
      </p>

    </div>


  </div>





  <section class="card">


    <h2 class="card-title">

      <span class="title-icon">

        <i class="fa-solid fa-user-plus"></i>

      </span>

      دروستکرنا بکارهێنەرێن نووی

    </h2>



    <form id="userForm">


      <div class="form-grid">


    

        <div class="form-group">

          <label for="name">

            <i class="fa-solid fa-user"></i>

            ناڤ

          </label>


          <div class="input-wrapper">

            <i class="fa-regular fa-user input-icon"></i>

            <input
              type="text"
              id="name"
              required
              autocomplete="off"
              placeholder="ناڤێ کارمەندی"
            >

          </div>

        </div>



      

        <div class="form-group">

          <label for="email">

            <i class="fa-solid fa-envelope"></i>

            ئیمەیڵ

          </label>


          <div class="input-wrapper">

            <i class="fa-regular fa-envelope input-icon"></i>

            <input
              type="email"
              id="email"
              required
              autocomplete="off"
              placeholder="user@office.com"
              dir="ltr"
            >

          </div>

        </div>



       

        <div class="form-group">

          <label for="password">

            <i class="fa-solid fa-lock"></i>

            پەیڤا نهێنی

          </label>


          <div class="password-wrapper">

            <i class="fa-solid fa-key input-icon"></i>

            <input
              type="password"
              id="password"
              minlength="6"
              required
              autocomplete="new-password"
              placeholder="پەیڤا نهێنی"
            >


            <button
              type="button"
              class="eye-btn"
              id="eyeBtn"
              aria-label="نیشاندانا پەیڤا نهێنی"
            >

              <i
                class="fa-regular fa-eye"
                id="eyeIcon"
              ></i>

            </button>

          </div>

        </div>


      </div>



      <button
        type="submit"
        class="create-btn"
        id="createBtn"
      >

        <i class="fa-solid fa-user-plus"></i>

        <span id="createBtnText">
          دروستکرنا بکارهێنەری
        </span>

      </button>



      <div
        id="message"
        class="message"
      ></div>


    </form>


  </section>



  

  <section class="card">


    <h2 class="card-title">

      <span class="title-icon">

        <i class="fa-solid fa-users"></i>

      </span>

      بکارهێنەرێن تومارکری

    </h2>



    <div class="table-wrapper">


      <table>


        <thead>

          <tr>

            <th>
              #
            </th>


            <th>

              <i class="fa-solid fa-user"></i>

              ناڤ

            </th>


            <th>

              <i class="fa-solid fa-envelope"></i>

              ئیمەیڵ

            </th>


            <th>

              <i class="fa-solid fa-user-shield"></i>

              رول

            </th>


            <th>

              <i class="fa-solid fa-circle-check"></i>

              بارودۆخ

            </th>

          </tr>

        </thead>


        <tbody id="usersTable">


          <tr>

            <td
              colspan="5"
              class="empty"
            >

              <i class="fa-solid fa-spinner fa-spin"></i>

              چاڤەرێ بە...

            </td>

          </tr>


        </tbody>


      </table>


    </div>


  </section>


</div>



<script type="module">




import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  set,
  get,
  onValue,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";





const firebaseConfig = {

  apiKey:
    "AIzaSyB83R6OlUr5p7W5EkTvHpwjfgBirsfQbek",

  authDomain:
    "office-8e7cb.firebaseapp.com",

  databaseURL:
    "https://office-8e7cb-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "office-8e7cb",

  storageBucket:
    "office-8e7cb.firebasestorage.app",

  messagingSenderId:
    "604465845047",

  appId:
    "1:604465845047:web:42004e33906c8986ee80b2",

  measurementId:
    "G-LJJM71LQ0K"

};





const ADMIN_LOGIN_URL =
  "/adminoffice/login/Login.html";


const ADMIN_DASHBOARD_URL =
  "/adminoffice/dashboard/Dashboard.html";





const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(
    app
  );


const database =
  getDatabase(
    app
  );





const creatorApp =
  initializeApp(
    firebaseConfig,
    "userCreator"
  );


const creatorAuth =
  getAuth(
    creatorApp
  );





const userForm =
  document.getElementById(
    "userForm"
  );


const nameInput =
  document.getElementById(
    "name"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const createBtn =
  document.getElementById(
    "createBtn"
  );


const createBtnText =
  document.getElementById(
    "createBtnText"
  );


const message =
  document.getElementById(
    "message"
  );


const usersTable =
  document.getElementById(
    "usersTable"
  );


const eyeBtn =
  document.getElementById(
    "eyeBtn"
  );


const eyeIcon =
  document.getElementById(
    "eyeIcon"
  );


const backBtn =
  document.getElementById(
    "backBtn"
  );





backBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      ADMIN_DASHBOARD_URL;

  }
);





let usersListenerStarted =
  false;


onAuthStateChanged(
  auth,
  async owner => {


    if (!owner) {

      window.location.replace(
        ADMIN_LOGIN_URL
      );

      return;

    }


    try {

      const ownerSnapshot =
        await get(

          ref(
            database,
            `users/${owner.uid}`
          )

        );


      if (
        !ownerSnapshot.exists()
      ) {

        await signOut(
          auth
        );


        window.location.replace(
          ADMIN_LOGIN_URL
        );


        return;

      }


      const ownerData =
        ownerSnapshot.val();


      if (
        String(
          ownerData.role || ""
        ).toLowerCase() !==
        "owner"

        ||

        ownerData.active === false
      ) {

        await signOut(
          auth
        );


        window.location.replace(
          ADMIN_LOGIN_URL
        );


        return;

      }


      startUsersListener();

    }
    catch(error) {

      console.error(
        "Owner verification error:",
        error
      );


      showMessage(
        "هەڵە د پشکنینا هەژمارێ رێڤەبەری.",
        "error"
      );

    }

  }
);





userForm.addEventListener(
  "submit",
  async event => {


    event.preventDefault();


    clearMessage();


    const name =
      nameInput.value
        .trim();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    const password =
      passwordInput.value;


    if (
      !name ||
      !email ||
      !password
    ) {

      showMessage(
        "هیڤیە هەمی خانەیان پڕ بکە.",
        "error"
      );


      return;

    }


    if (
      password.length < 6
    ) {

      showMessage(
        "پەیڤا نهێنی کێمترین 6 پیت بیت.",
        "error"
      );


      return;

    }


    if (
      !auth.currentUser
    ) {

      showMessage(
        "هەژمارێ رێڤەبەری نەهاتە ناسین.",
        "error"
      );


      return;

    }


    createBtn.disabled =
      true;


    createBtnText.textContent =
      "چاڤەرێ بە...";


    try {


      

      const userCredential =
        await createUserWithEmailAndPassword(

          creatorAuth,

          email,

          password

        );


      const newUser =
        userCredential.user;



      

      await set(

        ref(
          database,
          `users/${newUser.uid}`
        ),

        {

          name,

          email,

          role:
            "user",

          active:
            true,

          createdBy:
            auth.currentUser.uid,

          createdAt:
            serverTimestamp()

        }

      );



      

      await signOut(
        creatorAuth
      );


      userForm.reset();


      passwordInput.type =
        "password";


      eyeIcon.className =
        "fa-regular fa-eye";


      showMessage(
        "بکارهێنەر ب سەرکەفتی هات دروستکرن.",
        "success"
      );

    }
    catch(error) {

      console.error(
        "Create user error:",
        error
      );


      let text =
        "هەڵەیەک روو دا.";


      if (
        error.code ===
        "auth/email-already-in-use"
      ) {

        text =
          "ئەڤ ئیمەیڵە ژ بەری نوکە هاتیە بکارئینان.";

      }


      else if (
        error.code ===
        "auth/invalid-email"
      ) {

        text =
          "ئیمەیلا داخلکری یا دروست نینە.";

      }


      else if (
        error.code ===
        "auth/weak-password"
      ) {

        text =
          "پەیڤا نهێنی زەعیفە.";

      }


      else if (
        error.code ===
        "auth/network-request-failed"
      ) {

        text =
          "پەیوەندی ب ئینتەرنێتێ ڤە نینە.";

      }


      else if (
        error.code ===
        "PERMISSION_DENIED"

        ||

        error.code ===
        "database/permission-denied"
      ) {

        text =
          "دەستهەلاتا نووسینێ د Database دا نینە.";

      }


      showMessage(
        text,
        "error"
      );

    }
    finally {

      createBtn.disabled =
        false;


      createBtnText.textContent =
        "دروستکرنا بەکارهێنەری";

    }

  }
);





function startUsersListener() {


  if (
    usersListenerStarted
  ) {

    return;

  }


  usersListenerStarted =
    true;


  onValue(

    ref(
      database,
      "users"
    ),

    snapshot => {


      usersTable.innerHTML =
        "";


      if (
        !snapshot.exists()
      ) {

        renderEmptyUsers();

        return;

      }


      const data =
        snapshot.val();


      const users =
        Object.entries(
          data
        )

        .map(
          ([uid, user]) => ({
            uid,
            ...(user || {})
          })
        )

        .filter(
          user =>

            String(
              user.role || ""
            ).toLowerCase() ===
            "user"
        )

        .sort(
          (a, b) =>

            String(
              a.name || ""
            )

            .localeCompare(
              String(
                b.name || ""
              )
            )
        );


      if (
        users.length === 0
      ) {

        renderEmptyUsers();

        return;

      }


      users.forEach(
        (
          user,
          index
        ) => {


          const active =
            user.active !== false;


          const row =
            document.createElement(
              "tr"
            );


          row.innerHTML = `

            <td>

              <span class="row-number">

                ${index + 1}

              </span>

            </td>


            <td>

              <div class="user-cell">

                <div class="user-avatar">

                  <i class="fa-solid fa-user"></i>

                </div>

                <div class="user-name">

                  ${escapeHTML(
                    user.name || "-"
                  )}

                </div>

              </div>

            </td>


            <td class="email">

              <i class="fa-regular fa-envelope"></i>

              ${escapeHTML(
                user.email || "-"
              )}

            </td>


            <td>

              <span class="role-badge">

                <i class="fa-solid fa-user"></i>

                User

              </span>

            </td>


            <td>

              <span
                class="
                  status
                  ${
                    active
                      ?
                      "active"
                      :
                      "inactive"
                  }
                "
              >

                <span class="status-dot"></span>

                ${
                  active
                    ?
                    "چالاک"
                    :
                    "راگرتی"
                }

              </span>

            </td>

          `;


          usersTable.appendChild(
            row
          );

        }
      );

    },

    error => {

      console.error(
        "Users listener error:",
        error
      );


      usersTable.innerHTML = `

        <tr>

          <td
            colspan="5"
            class="empty"
          >

            <i class="fa-solid fa-triangle-exclamation"></i>

            هەڵە د بارکرنا بکارهێنەران

          </td>

        </tr>

      `;

    }

  );

}





function renderEmptyUsers() {

  usersTable.innerHTML = `

    <tr>

      <td
        colspan="5"
        class="empty"
      >

        <i class="fa-solid fa-users-slash"></i>

        هێشتا بکارهێنەر نەهاتیە دروستکرن

      </td>

    </tr>

  `;

}





eyeBtn.addEventListener(
  "click",
  () => {


    const hidden =
      passwordInput.type ===
      "password";


    passwordInput.type =
      hidden
        ?
        "text"
        :
        "password";


    eyeIcon.className =
      hidden
        ?
        "fa-regular fa-eye-slash"
        :
        "fa-regular fa-eye";

  }
);





function showMessage(
  text,
  type
) {

  const icon =
    type === "success"
      ?
      "fa-circle-check"
      :
      "fa-circle-exclamation";


  message.innerHTML = `

    <i class="fa-solid ${icon}"></i>

    <span>

      ${escapeHTML(text)}

    </span>

  `;


  message.className =
    `message ${type}`;

}



function clearMessage() {

  message.innerHTML =
    "";


  message.className =
    "message";

}





function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


</script>
