<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    >

    <title>Office</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* LOGIN BOX */

        .login-box {
            width: 90%;
            max-width: 420px;

            padding: 50px 40px;

            background: #ffffff;

            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.1),
                0 0 0 1px rgba(0, 0, 0, 0.02);
        }


        .login-box h2 {
            margin: 0 0 40px;

            text-align: center;

            color: #111827;

            font-size: 30px;
            font-weight: 800;
        }


        /* INPUT */

        .user-box {
            position: relative;
            margin-bottom: 28px;
        }


        .user-box input {
            width: 100%;

            padding: 18px 20px;

            border: 2px solid #e5e7eb;
            border-radius: 16px;

            background: #f9fafb;

            color: #1f2937;

            font-size: 16px;

            outline: none;

            transition: 0.3s ease;
        }


        .password-input {
            padding-left: 55px !important;
        }


        .user-box label {
            position: absolute;

            top: 50%;
            right: 20px;

            transform: translateY(-50%);

            padding: 0 6px;

            color: #9ca3af;

            font-size: 16px;

            pointer-events: none;

            transition: 0.3s ease;
        }


        .user-box input:focus,
        .user-box input:valid {
            border-color: #ff7e5f;

            background: #ffffff;

            box-shadow:
                0 0 0 4px rgba(255, 126, 95, 0.1);
        }


        .user-box input:focus ~ label,
        .user-box input:valid ~ label {
            top: 0;

            background: #ffffff;

            color: #ff7e5f;

            font-size: 14px;
            font-weight: 700;
        }


        /* PASSWORD EYE */

        .toggle-password {
            position: absolute;

            top: 50%;
            left: 12px;

            transform: translateY(-50%);

            width: 40px;
            height: 40px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            color: #9ca3af;

            cursor: pointer;

            transition: 0.3s ease;
        }


        .toggle-password:hover {
            background: #f3f4f6;
            color: #374151;
        }


        .toggle-password svg {
            width: 22px;
            height: 22px;
        }


        /* MESSAGE */

        .message {
            display: none;

            margin-bottom: 18px;

            padding: 14px 16px;

            border-radius: 14px;

            text-align: center;

            font-size: 15px;
            font-weight: 700;

            line-height: 1.6;
        }


        .message.error {
            display: block;

            background: #fef2f2;

            color: #dc2626;

            border: 1px solid #fecaca;
        }


        .message.success {
            display: block;

            background: #f0fdf4;

            color: #16a34a;

            border: 1px solid #bbf7d0;
        }


        /* BUTTON */

        .submit-btn {
            width: 100%;

            margin-top: 15px;

            padding: 18px 20px;

            border: none;
            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #FF9800,
                    #FF5722
                );

            color: #ffffff;

            font-size: 18px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 20px rgba(255, 87, 34, 0.3);

            transition: 0.3s ease;
        }


        .submit-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 15px 25px rgba(255, 87, 34, 0.4);
        }


        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }


        /* MOBILE */

        @media (max-width: 480px) {

            .login-box {
                width: 92%;
                padding: 40px 25px;
            }

        }


        /* COMPUTER / LAPTOP */

        @media
        (min-width: 1024px)
        and (hover: hover)
        and (pointer: fine) {

            .login-box {
                width: 560px;
                max-width: 560px;

                padding: 68px 60px;

                border-radius: 30px;
            }


            .login-box h2 {
                margin-bottom: 48px;
                font-size: 40px;
            }


            .user-box {
                margin-bottom: 32px;
            }


            .user-box input {
                padding: 22px 24px;

                border-radius: 18px;

                font-size: 20px;
            }


            .password-input {
                padding-left: 64px !important;
            }


            .user-box label {
                right: 24px;
                font-size: 19px;
            }


            .user-box input:focus ~ label,
            .user-box input:valid ~ label {
                font-size: 16px;
            }


            .toggle-password {
                left: 15px;

                width: 46px;
                height: 46px;
            }


            .toggle-password svg {
                width: 25px;
                height: 25px;
            }


            .message {
                font-size: 17px;
            }


            .submit-btn {
                padding: 21px 24px;

                border-radius: 34px;

                font-size: 21px;
            }

        }

    </style>

</head>


<body>


    <div class="login-box">


        <h2>
            Leave Portal
        </h2>


        <form id="loginForm">


            <!-- EMAIL -->

            <div class="user-box">

                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="email"
                    enterkeyhint="next"
                >

                <label for="email">
                    ئیمەیڵ
                </label>

            </div>


            <!-- PASSWORD -->

            <div class="user-box">


                <input
                    type="password"
                    id="password"
                    class="password-input"
                    required
                    autocomplete="current-password"
                    enterkeyhint="done"
                >


                <label for="password">
                    پەیڤا نهێنی
                </label>


                <div
                    class="toggle-password"
                    id="togglePasswordBtn"
                    title="نیشاندانا پاسوۆردی"
                >


                    <svg
                        id="eyeIcon"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                        />

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                        />

                    </svg>


                </div>


            </div>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- LOGIN -->

            <button
                type="submit"
                id="loginBtn"
                class="submit-btn"
            >
                چوونا ژوور
            </button>


        </form>


    </div>



    <script type="module">


        /* FIREBASE */

        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


        import {
            getAuth,
            signInWithEmailAndPassword,
            signOut
        }
        from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


        import {
            getDatabase,
            ref,
            get
        }
        from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";



        /* CONFIG */

        const firebaseConfig = {

            apiKey:
                "AIzaSyB83R6OlUr5p7W5EkTvHpwjfgBirsfQbek",

            authDomain:
                "office-8e7cb.firebaseapp.com",

            databaseURL:
                "https://office-8e7cb-default-rtdb.europe-west1.firebasedatabase.app",

            projectId:
                "office-8e7cb",

            storageBucket:
                "office-8e7cb.firebasestorage.app",

            messagingSenderId:
                "604465845047",

            appId:
                "1:604465845047:web:42004e33906c8986ee80b2",

            measurementId:
                "G-LJJM71LQ0K"

        };



        /* INITIALIZE */

        const app =
            initializeApp(
                firebaseConfig
            );


        const auth =
            getAuth(app);


        const database =
            getDatabase(app);



        /* ELEMENTS */

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const loginBtn =
            document.getElementById(
                "loginBtn"
            );


        const messageBox =
            document.getElementById(
                "message"
            );


        const togglePasswordBtn =
            document.getElementById(
                "togglePasswordBtn"
            );


        const eyeIcon =
            document.getElementById(
                "eyeIcon"
            );



        /* MESSAGE */

        function showMessage(
            text,
            type
        ) {

            messageBox.textContent =
                text;


            messageBox.className =
                `message ${type}`;

        }


        function clearMessage() {

            messageBox.textContent =
                "";


            messageBox.className =
                "message";

        }



        /* LOADING */

        function setLoading(
            loading
        ) {

            loginBtn.disabled =
                loading;


            loginBtn.textContent =
                loading
                ? "چاڤەرێ بە..."
                : "چوونا ژوور";

        }



        /* LOGIN */

        loginForm.addEventListener(
            "submit",
            async function(event) {


                event.preventDefault();


                clearMessage();


                const email =
                    emailInput
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    passwordInput.value;


                if (
                    !email ||
                    !password
                ) {

                    showMessage(
                        "هیڤیە ئیمەیڵ و پەیڤا نهێنی بنڤیسە.",
                        "error"
                    );

                    return;
                }


                setLoading(true);


                try {


                    /* 1. AUTHENTICATION */

                    const credential =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const owner =
                        credential.user;



                    /* 2. OWNER PROFILE */

                    const snapshot =
                        await get(

                            ref(
                                database,
                                `users/${owner.uid}`
                            )

                        );



                    /* PROFILE DOES NOT EXIST */

                    if (!snapshot.exists()) {


                        await signOut(auth);


                        showMessage(
                            "پروفایلێ رێڤەبەری نەهاتە دیتن.",
                            "error"
                        );


                        setLoading(false);


                        return;
                    }


                    const profile =
                        snapshot.val();



                    /* 3. OWNER ROLE CHECK */

                    if (
                        profile.role !==
                        "owner"
                    ) {


                        await signOut(auth);


                        showMessage(
                            "ئەڤ هەژمارە یێ رێڤەبەری نینە.",
                            "error"
                        );


                        setLoading(false);


                        return;
                    }



                    /* 4. ACTIVE */

                    if (
                        profile.active === false
                    ) {


                        await signOut(auth);


                        showMessage(
                            "هەژمارێ رێڤەبەری هاتیە راگرتن.",
                            "error"
                        );


                        setLoading(false);


                        return;
                    }



                    /* SUCCESS */

                    showMessage(
                        "چوونا ژوور ب سەرکەفتی بوو.",
                        "success"
                    );


                    setTimeout(
                        function() {

                            window.location.replace(
                                "../dashboard/Dashboard.html"
                            );

                        },
                        500
                    );


                }
                catch(error) {


                    console.error(
                        "Owner login error:",
                        error
                    );


                    let errorMessage =
                        "هەڵەیەک روو دا. دوبارە هەوڵ بدە.";


                    if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        errorMessage =
                            "ئیمەیڵ یان پەیڤا نهێنی یا خەلەتە.";

                    }


                    else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        errorMessage =
                            "ئیمەیلا تە یا دروست نینە.";

                    }


                    else if (
                        error.code ===
                        "auth/user-disabled"
                    ) {

                        errorMessage =
                            "ئەڤ هەژمارە هاتیە راگرتن.";

                    }


                    else if (
                        error.code ===
                        "auth/too-many-requests"
                    ) {

                        errorMessage =
                            "هەوڵێن زۆر هاتنە دان. پاش ماوەیەکێ دوبارە هەوڵ بدە.";

                    }


                    else if (
                        error.code ===
                        "auth/network-request-failed"
                    ) {

                        errorMessage =
                            "پەیوەندی ب ئینتەرنێتێ ڤە نینە.";

                    }


                    else if (
                        error.code ===
                        "PERMISSION_DENIED" ||
                        error.code ===
                        "database/permission-denied"
                    ) {

                        errorMessage =
                            "دەستهەلاتا دیتنا داتایان نینە.";

                    }


                    showMessage(
                        errorMessage,
                        "error"
                    );


                    setLoading(false);

                }


            }
        );



        /* PASSWORD SHOW / HIDE */

        togglePasswordBtn.addEventListener(
            "click",
            function() {


                if (
                    passwordInput.type ===
                    "password"
                ) {


                    passwordInput.type =
                        "text";


                    togglePasswordBtn.title =
                        "ڤەشارتنا پاسوۆردی";


                    eyeIcon.innerHTML = `

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                        />

                    `;


                }
                else {


                    passwordInput.type =
                        "password";


                    togglePasswordBtn.title =
                        "نیشاندانا پاسوۆردی";


                    eyeIcon.innerHTML = `

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                        />

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                        />

                    `;

                }


            }
        );


    </script>


</body>

</html>
