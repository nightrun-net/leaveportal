<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
  >

  <title>Office</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

      background-color: #f8fafc;
      color: #0f172a;

      -webkit-tap-highlight-color: transparent;
    }

    /* =====================================
       PAGE LOADING
    ===================================== */

    .page-loading {
      position: fixed;
      inset: 0;

      background: #f8fafc;

      display: flex;
      justify-content: center;
      align-items: center;

      z-index: 9999;

      transition: opacity 0.25s ease;
    }

    .page-loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 46px;
      height: 46px;

      border-radius: 50%;

      border: 5px solid #e5e7eb;
      border-top-color: #ff7a22;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =====================================
       CONTAINER
    ===================================== */

    .container {
      max-width: 1000px;

      margin: 0 auto;

      padding: 20px;
    }

    /* =====================================
       PROFILE HEADER
    ===================================== */

    .profile-header {
      background: transparent;

      padding:
        10px
        5px
        20px;

      display: flex;
      align-items: center;

      gap: 15px;

      margin-bottom: 25px;
    }

    .avatar-bg {
      width: 60px;
      height: 60px;

      flex-shrink: 0;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      background-color:
        rgba(255, 136, 0, 0.12);

      color: #e65100;

      box-shadow:
        0
        5px
        15px
        rgba(255, 136, 0, 0.1);

      transition: all 0.3s ease;
    }

    .avatar-bg svg {
      width: 30px;
      height: 30px;
    }

    .user-info {
      min-width: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .welcome-text {
      margin-bottom: 4px;

      font-size: 13px;
      font-weight: 600;

      color: #64748b;
    }

    .user-name {
      margin: 0;

      font-size: 20px;
      font-weight: 800;

      color: #0f172a;

      word-break: break-word;
    }

    /* =====================================
       LOGOUT
    ===================================== */

    .logout-btn {
      margin-right: auto;

      min-width: 118px;
      height: 48px;

      padding:
        0
        17px;

      border: 0;
      border-radius: 16px;

      background: #ffffff;
      color: #dc2626;

      box-shadow:
        0
        8px
        24px
        rgba(15, 23, 42, 0.07);

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      font: inherit;

      font-size: 14px;
      font-weight: 800;

      cursor: pointer;

      transition: 0.25s ease;
    }

    .logout-btn:hover {
      background: #dc2626;
      color: #ffffff;

      transform: translateY(-2px);

      box-shadow:
        0
        12px
        26px
        rgba(220, 38, 38, 0.18);
    }

    .logout-btn:disabled {
      opacity: 0.6;

      cursor: not-allowed;

      transform: none;
    }

    .logout-btn svg {
      width: 20px;
      height: 20px;

      flex-shrink: 0;
    }

    /* =====================================
       CARDS
    ===================================== */

    .cards-wrapper {
      display: flex;
      flex-wrap: wrap;

      gap: 20px;
    }

    .card {
      position: relative;

      flex:
        1
        1
        calc(50% - 20px);

      min-height: 205px;

      overflow: hidden;

      padding: 25px;

      border:
        1px
        solid
        #f1f5f9;

      border-radius: 24px;

      background: #ffffff;

      text-decoration: none;

      box-shadow:
        0
        12px
        30px
        rgba(0, 0, 0, 0.04);

      display: flex;
      flex-direction: column;
      justify-content: flex-start;

      transition: all 0.3s ease;
    }

    .card:hover,
    .card:active {
      transform: translateY(-5px);

      box-shadow:
        0
        20px
        40px
        rgba(255, 136, 0, 0.1);

      border-color:
        rgba(255, 136, 0, 0.2);
    }

    .card-icon-container,
    .card-content {
      position: relative;
      z-index: 2;
    }

    .card-icon-container {
      width: 55px;
      height: 55px;

      margin-bottom: 20px;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      background-color:
        rgba(255, 136, 0, 0.12);

      color: #e65100;

      transition: all 0.3s ease;
    }

    .card-icon-container svg {
      width: 28px;
      height: 28px;
    }

    .card:hover .card-icon-container {
      background-color: #ff8c00;
      color: #ffffff;

      transform: scale(1.05);
    }

    .card-content h3 {
      margin:
        0
        0
        10px;

      font-size: 22px;
      font-weight: 800;

      color: #1e293b;
    }

    .card-content p {
      margin: 0;

      font-size: 15px;

      color: #64748b;

      line-height: 1.6;
    }

    .card-icon-bg {
      position: absolute;

      bottom: -20px;
      left: -15px;

      width: 140px;
      height: 140px;

      color: #ff8c00;

      opacity: 0.05;

      transform: rotate(-20deg);

      z-index: 1;

      pointer-events: none;
    }

    /* =====================================
       LIVE COUNTS
    ===================================== */

    .live-count {
      position: absolute;

      top: 18px;
      left: 18px;

      z-index: 5;

      min-width: 34px;
      height: 34px;

      padding:
        0
        9px;

      border-radius: 999px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ef4444;
      color: #ffffff;

      border:
        4px
        solid
        #ffffff;

      box-shadow:
        0
        7px
        18px
        rgba(239, 68, 68, 0.25);

      font-size: 12px;
      font-weight: 900;

      direction: ltr;

      transition: transform 0.2s ease;
    }

    .live-count.count-update {
      animation:
        countPulse
        0.35s
        ease;
    }

    @keyframes countPulse {
      50% {
        transform: scale(1.18);
      }
    }

    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 600px) {

      .container {
        padding:
          18px
          15px;
      }

      .card {
        flex:
          1
          1
          100%;
      }

      .profile-header {
        margin-bottom: 20px;

        gap: 12px;
      }

      .user-name {
        font-size: 19px;
      }

      .logout-btn {
        width: 48px;
        min-width: 48px;
        height: 48px;

        padding: 0;

        border-radius: 14px;
      }

      .logout-btn span {
        display: none;
      }
    }

    /* =====================================
       LAPTOP / DESKTOP
    ===================================== */

    @media
      (min-width: 1024px)
      and (hover: hover)
      and (pointer: fine) {

      .container {
        max-width: 1150px;

        padding:
          35px
          30px;
      }

      .profile-header {
        margin-bottom: 35px;
      }

      .avatar-bg {
        width: 75px;
        height: 75px;
      }

      .avatar-bg svg {
        width: 37px;
        height: 37px;
      }

      .welcome-text {
        margin-bottom: 5px;

        font-size: 16px;
      }

      .user-name {
        font-size: 27px;
      }

      .logout-btn {
        min-width: 150px;
        height: 58px;

        padding:
          0
          22px;

        border-radius: 18px;

        font-size: 18px;
      }

      .logout-btn svg {
        width: 24px;
        height: 24px;
      }

      .cards-wrapper {
        gap: 25px;
      }

      .card {
        min-height: 235px;

        padding: 32px;

        border-radius: 28px;
      }

      .card-icon-container {
        width: 65px;
        height: 65px;

        margin-bottom: 24px;
      }

      .card-icon-container svg {
        width: 32px;
        height: 32px;
      }

      .card-content h3 {
        font-size: 27px;
      }

      .card-content p {
        font-size: 18px;
      }

      .live-count {
        top: 23px;
        left: 23px;

        min-width: 42px;
        height: 42px;

        padding:
          0
          11px;

        font-size: 15px;
      }
    }
  </style>
</head>

  <script type="module">


    import {
      initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged,
      signOut
    }
    from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
      getDatabase,
      ref,
      onValue,
      query,
      orderByChild,
      equalTo
    }
    from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    /* =========================================
       FIREBASE CONFIG
    ========================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyB83R6OlUr5p7W5EkTvHpwjfgBirsfQbek",

      authDomain:
        "office-8e7cb.firebaseapp.com",

      databaseURL:
        "https://office-8e7cb-default-rtdb.europe-west1.firebasedatabase.app",

      projectId:
        "office-8e7cb",

      storageBucket:
        "office-8e7cb.firebasestorage.app",

      messagingSenderId:
        "604465845047",

      appId:
        "1:604465845047:web:42004e33906c8986ee80b2",

      measurementId:
        "G-LJJM71LQ0K"

    };


    /* =========================================
       URLS
    ========================================== */

    const USER_LOGIN_URL =
      "./office/index.html";


    /* =========================================
       INIT
    ========================================== */

    const app =
      initializeApp(
        firebaseConfig
      );


    const auth =
      getAuth(
        app
      );


    const database =
      getDatabase(
        app
      );


    /* =========================================
       ELEMENTS
    ========================================== */

    const userName =
      document.getElementById(
        "userName"
      );


    const pageLoading =
      document.getElementById(
        "pageLoading"
      );


    const logoutBtn =
      document.getElementById(
        "logoutBtn"
      );


    const historyCount =
      document.getElementById(
        "historyCount"
      );


    const alertsCount =
      document.getElementById(
        "alertsCount"
      );


    /* =========================================
       STATE
    ========================================== */

    let currentUser =
      null;


    let countsStarted =
      false;


    /*
     * This now stores only this
     * employee's alerts.
     */
    let userAlertsCache =
      {};


    /* =========================================
       HELPERS
    ========================================== */

    function hideLoading() {

      pageLoading
        .classList
        .add(
          "hide"
        );


      setTimeout(
        () => {

          pageLoading.style.display =
            "none";

        },
        250
      );

    }


    function displayCount(
      value
    ) {

      return value > 99
        ?
        "99+"
        :
        String(
          value
        );

    }


    function updateBadge(
      element,
      value
    ) {

      if (!element) {

        return;

      }


      const nextValue =
        displayCount(
          value
        );


      if (
        element.textContent !==
        nextValue
      ) {

        element.textContent =
          nextValue;


        element.classList.remove(
          "count-update"
        );


        void element.offsetWidth;


        element.classList.add(
          "count-update"
        );

      }

    }


    /* =========================================
       LOGIN
    ========================================== */

    async function goToLogin() {

      try {

        await signOut(
          auth
        );

      }
      catch(error) {

        console.error(
          "Sign out error:",
          error
        );

      }


      window.location.replace(
        USER_LOGIN_URL
      );

    }


    /* =========================================
       LOGOUT
    ========================================== */

    logoutBtn.addEventListener(
      "click",
      async () => {


        logoutBtn.disabled =
          true;


        try {

          await signOut(
            auth
          );


          window.location.replace(
            USER_LOGIN_URL
          );

        }
        catch(error) {

          console.error(
            "Logout error:",
            error
          );


          logoutBtn.disabled =
            false;

        }

      }
    );


    /* =========================================
       ALERT READ STATE

       MUST MATCH Agahdari.html
    ========================================== */

    function readStorageKey() {

      if (!currentUser) {

        return null;

      }


      return (
        `office_read_alerts_${currentUser.uid}`
      );

    }


    function getReadAlertIds() {

      const key =
        readStorageKey();


      if (!key) {

        return new Set();

      }


      try {

        const stored =
          JSON.parse(

            localStorage.getItem(
              key
            )

            ||

            "[]"

          );


        return new Set(

          Array.isArray(
            stored
          )
            ?
            stored
            :
            []

        );

      }
      catch(error) {

        console.error(
          "Read alerts storage error:",
          error
        );


        return new Set();

      }

    }


    /* =========================================
       COUNT UNREAD USER ALERTS
    ========================================== */

    function updateUnreadAlertsCount() {

      const readIds =
        getReadAlertIds();


      /*
       * userAlertsCache already contains
       * ONLY alerts belonging to this employee.
       *
       * No target filtering is required.
       */

      const activeAlerts =
        Object.entries(
          userAlertsCache
        )

          .filter(
            (
              [
                alertId,
                alertItem
              ]
            ) => {

              return (
                alertItem &&
                alertItem.active !== false
              );

            }
          );


      const unreadTotal =
        activeAlerts

          .filter(
            ([alertId]) =>

              !readIds.has(
                alertId
              )
          )

          .length;


      updateBadge(
        alertsCount,
        unreadTotal
      );

    }


    /* =========================================
       START LIVE COUNTS
    ========================================== */

    function startDashboardCounts(
      userId
    ) {


      if (
        countsStarted
      ) {

        return;

      }


      countsStarted =
        true;


      /* =====================================
         LEAVE HISTORY

         APPROVED + REJECTED
      ===================================== */

      const userRequestsQuery =
        query(

          ref(
            database,
            "leaveRequests"
          ),

          orderByChild(
            "userId"
          ),

          equalTo(
            userId
          )

        );


      onValue(

        userRequestsQuery,

        snapshot => {


          const requests =
            snapshot.exists()
              ?
              Object.values(
                snapshot.val() || {}
              )
              :
              [];


          let approved =
            0;


          let rejected =
            0;


          requests.forEach(
            requestItem => {


              const status =
                String(
                  requestItem?.status ||
                  ""
                )
                  .toLowerCase();


              if (
                status ===
                "approved"
              ) {

                approved++;

              }


              else if (
                status ===
                "rejected"
              ) {

                rejected++;

              }

            }
          );


          const history =
            approved +
            rejected;


          updateBadge(
            historyCount,
            history
          );

        },

        error => {

          console.error(
            "Leave requests count error:",
            error
          );


          updateBadge(
            historyCount,
            0
          );

        }

      );


      /* =====================================
         THIS USER'S ALERTS

         IMPORTANT:
         READ FROM userAlerts/UID
      ===================================== */

      onValue(

        ref(
          database,
          `userAlerts/${userId}`
        ),

        snapshot => {


          userAlertsCache =
            snapshot.exists()
              ?
              (
                snapshot.val() ||
                {}
              )
              :
              {};


          updateUnreadAlertsCount();

        },

        error => {

          console.error(
            "User alerts count error:",
            error
          );


          userAlertsCache =
            {};


          updateBadge(
            alertsCount,
            0
          );

        }

      );

    }


    /* =========================================
       REFRESH AFTER USER READS ALERTS

       Example:
       Dashboard
          ↓
       Agahdari.html
          ↓
       User opens alert
          ↓
       localStorage changes
          ↓
       Return to Dashboard
          ↓
       Count updates
    ========================================== */

    window.addEventListener(
      "pageshow",
      () => {

        if (
          currentUser
        ) {

          updateUnreadAlertsCount();

        }

      }
    );


    window.addEventListener(
      "focus",
      () => {

        if (
          currentUser
        ) {

          updateUnreadAlertsCount();

        }

      }
    );


    window.addEventListener(
      "storage",
      event => {


        if (
          !currentUser
        ) {

          return;

        }


        if (
          event.key ===
          `office_read_alerts_${currentUser.uid}`
        ) {

          updateUnreadAlertsCount();

        }

      }
    );


    /* =========================================
       AUTH
    ========================================== */

    onAuthStateChanged(

      auth,

      user => {


        if (!user) {

          window.location.replace(
            USER_LOGIN_URL
          );


          return;

        }


        const userRef =
          ref(
            database,
            `users/${user.uid}`
          );


        onValue(

          userRef,

          async snapshot => {


            if (
              !snapshot.exists()
            ) {

              console.error(
                "User profile not found"
              );


              await goToLogin();


              return;

            }


            const profile =
              snapshot.val();


            /* USER ONLY */

            if (
              String(
                profile.role ||
                ""
              )
                .toLowerCase()
              !==
              "user"
            ) {

              console.error(
                "Account is not a user account"
              );


              await goToLogin();


              return;

            }


            /* ACTIVE USER ONLY */

            if (
              profile.active ===
              false
            ) {

              console.error(
                "Account is disabled"
              );


              await goToLogin();


              return;

            }


            currentUser =
              user;


            userName.textContent =
              profile.name ||
              "بەکارهێنەر";


            hideLoading();


            startDashboardCounts(
              user.uid
            );

          },

          async error => {

            console.error(
              "Realtime Database error:",
              error
            );


            await goToLogin();

          }

        );

      }

    );

  </script>

</body>

</html>
