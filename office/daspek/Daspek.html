<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    >

    <title>Office</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;
            padding: 0;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background-color: #f8fafc;

            -webkit-tap-highlight-color: transparent;
        }


        /* =====================================
           PAGE LOADING
        ===================================== */

        .page-loading {

            position: fixed;

            inset: 0;

            background: #f8fafc;

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 9999;

            transition: opacity 0.25s ease;
        }


        .page-loading.hide {

            opacity: 0;

            pointer-events: none;
        }


        .loader {

            width: 46px;
            height: 46px;

            border-radius: 50%;

            border: 5px solid #e5e7eb;

            border-top-color: #ff7a22;

            animation: spin 0.8s linear infinite;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =====================================
           CONTAINER
        ===================================== */

        .container {

            max-width: 1000px;

            margin: 0 auto;

            padding: 20px;
        }


        /* =====================================
           PROFILE HEADER
        ===================================== */

        .profile-header {

            background: transparent;

            padding: 10px 5px 20px 5px;

            display: flex;

            align-items: center;

            margin-bottom: 25px;
        }


        .avatar-bg {

            width: 60px;
            height: 60px;

            background-color:
                rgba(255, 136, 0, 0.12);

            border-radius: 50%;

            display: flex;

            justify-content: center;
            align-items: center;

            color: #e65100;

            box-shadow:
                0 5px 15px
                rgba(255, 136, 0, 0.1);

            flex-shrink: 0;

            transition: all 0.3s ease;
        }


        .avatar-bg svg {

            width: 30px;
            height: 30px;
        }


        .user-info {

            margin-right: 15px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .welcome-text {

            font-size: 13px;

            color: #64748b;

            margin-bottom: 4px;

            font-weight: 600;
        }


        .user-name {

            font-size: 20px;

            font-weight: 800;

            color: #0f172a;

            margin: 0;
        }


        /* =====================================
           CARDS
        ===================================== */

        .cards-wrapper {

            display: flex;

            flex-wrap: wrap;

            gap: 20px;
        }


        .card {

            flex: 1 1 calc(50% - 20px);

            background: #ffffff;

            border-radius: 24px;

            padding: 25px;

            text-decoration: none;

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.04);

            border:
                1px solid #f1f5f9;

            transition: all 0.3s ease;

            display: flex;

            flex-direction: column;

            justify-content: flex-start;

            position: relative;

            overflow: hidden;
        }


        .card:hover,
        .card:active {

            transform: translateY(-5px);

            box-shadow:
                0 20px 40px
                rgba(255, 136, 0, 0.1);

            border-color:
                rgba(255, 136, 0, 0.2);
        }


        .card-icon-container,
        .card-content {

            position: relative;

            z-index: 2;
        }


        .card-icon-container {

            width: 55px;
            height: 55px;

            background-color:
                rgba(255, 136, 0, 0.12);

            border-radius: 50%;

            display: flex;

            justify-content: center;
            align-items: center;

            color: #e65100;

            margin-bottom: 20px;

            transition: all 0.3s ease;
        }


        .card-icon-container svg {

            width: 28px;
            height: 28px;
        }


        .card:hover
        .card-icon-container {

            background-color: #ff8c00;

            color: #ffffff;

            transform: scale(1.05);
        }


        .card-content h3 {

            margin: 0 0 10px 0;

            font-size: 22px;

            font-weight: 800;

            color: #1e293b;
        }


        .card-content p {

            margin: 0;

            font-size: 15px;

            color: #64748b;

            line-height: 1.6;
        }


        .card-icon-bg {

            position: absolute;

            bottom: -20px;

            left: -15px;

            width: 140px;

            height: 140px;

            color: #ff8c00;

            opacity: 0.05;

            transform: rotate(-20deg);

            z-index: 1;

            pointer-events: none;
        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            .container {

                padding: 18px 15px;
            }


            .card {

                flex: 1 1 100%;
            }


            .profile-header {

                margin-bottom: 20px;
            }


            .user-name {

                font-size: 19px;
            }

        }


        /* =====================================
           LAPTOP / DESKTOP
        ===================================== */

        @media
        (min-width: 1024px)
        and (hover: hover)
        and (pointer: fine) {

            .container {

                max-width: 1150px;

                padding: 35px 30px;
            }


            .profile-header {

                margin-bottom: 35px;
            }


            .avatar-bg {

                width: 75px;
                height: 75px;
            }


            .avatar-bg svg {

                width: 37px;
                height: 37px;
            }


            .welcome-text {

                font-size: 16px;

                margin-bottom: 5px;
            }


            .user-name {

                font-size: 27px;
            }


            .user-info {

                margin-right: 18px;
            }


            .cards-wrapper {

                gap: 25px;
            }


            .card {

                padding: 32px;

                min-height: 210px;

                border-radius: 28px;
            }


            .card-icon-container {

                width: 65px;
                height: 65px;

                margin-bottom: 24px;
            }


            .card-icon-container svg {

                width: 32px;
                height: 32px;
            }


            .card-content h3 {

                font-size: 27px;
            }


            .card-content p {

                font-size: 18px;
            }

        }

    </style>

</head>


<body>

    <!-- =========================================
         FIREBASE
    ========================================== -->

    <script type="module">


        /* =========================================
           FIREBASE IMPORTS
        ========================================= */


        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged,
            signOut
        }
        from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


        import {
            getDatabase,
            ref,
            onValue
        }
        from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";



        /* =========================================
           FIREBASE CONFIG

           USE THE SAME CONFIG AS LOGIN.HTML
        ========================================= */
        const firebaseConfig = {
        apiKey: "AIzaSyB83R6OlUr5p7W5EkTvHpwjfgBirsfQbek",
        authDomain: "office-8e7cb.firebaseapp.com",
        databaseURL: "https://office-8e7cb-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "office-8e7cb",
        storageBucket: "office-8e7cb.firebasestorage.app",
        messagingSenderId: "604465845047",
        appId: "1:604465845047:web:42004e33906c8986ee80b2",
        measurementId: "G-LJJM71LQ0K"
        };


        /* =========================================
           INITIALIZE FIREBASE
        ========================================= */


        const app =
            initializeApp(
                firebaseConfig
            );


        const auth =
            getAuth(app);


        const database =
            getDatabase(app);



        /* =========================================
           ELEMENTS
        ========================================= */


        const userName =
            document.getElementById(
                "userName"
            );


        const pageLoading =
            document.getElementById(
                "pageLoading"
            );



        /* =========================================
           HIDE LOADING
        ========================================= */


        function hideLoading() {


            pageLoading.classList.add(
                "hide"
            );


            setTimeout(
                function() {


                    pageLoading.style.display =
                        "none";


                },
                250
            );

        }



        /* =========================================
           REDIRECT TO LOGIN
        ========================================= */


        async function goToLogin() {


            try {


                await signOut(auth);


            }
            catch(error) {


                console.error(
                    "Sign out error:",
                    error
                );


            }


            window.location.replace(
                "login.html"
            );

        }



        /* =========================================
           CHECK LOGGED-IN USER
        ========================================= */


        onAuthStateChanged(
            auth,
            function(user) {


                /*
                 * NOT LOGGED IN
                 */

                if (!user) {


                    window.location.replace(
                        "login.html"
                    );


                    return;
                }



                /* =================================
                   USER PROFILE REFERENCE
                ================================= */


                const userRef =
                    ref(
                        database,
                        `users/${user.uid}`
                    );



                /* =================================
                   REALTIME PROFILE LISTENER
                ================================= */


                onValue(
                    userRef,


                    async function(snapshot) {


                        /*
                         * PROFILE DOES NOT EXIST
                         */

                        if (!snapshot.exists()) {


                            console.error(
                                "User profile not found"
                            );


                            await goToLogin();


                            return;
                        }



                        const profile =
                            snapshot.val();



                        /* =================================
                           CHECK USER ROLE
                        ================================= */


                        if (
                            profile.role !== "user"
                        ) {


                            console.error(
                                "Account is not a user account"
                            );


                            await goToLogin();


                            return;
                        }



                        /* =================================
                           CHECK ACCOUNT ACTIVE
                        ================================= */


                        if (
                            profile.active === false
                        ) {


                            console.error(
                                "Account is disabled"
                            );


                            await goToLogin();


                            return;
                        }



                        /* =================================
                           SHOW REAL USER NAME
                        ================================= */


                        userName.textContent =
                            profile.name ||
                            "بەکارهێنەر";



                        /* =================================
                           DASHBOARD READY
                        ================================= */


                        hideLoading();


                    },


                    async function(error) {


                        console.error(
                            "Realtime Database error:",
                            error
                        );


                        await goToLogin();


                    }

                );


            }
        );


    </script>
