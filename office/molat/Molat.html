<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    >

    <title>Office</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            -webkit-tap-highlight-color: transparent;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 450px;
            margin: 0 auto;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
            position: relative;
            height: 50px;
        }

        .back-btn {
            position: absolute;
            right: 0;

            width: 45px;
            height: 45px;

            background-color: rgba(255, 136, 0, 0.12);

            border-radius: 50%;
            border: none;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #e65100;

            cursor: pointer;

            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: #ff8c00;
            color: #ffffff;
        }

        .back-btn svg {
            width: 22px;
            height: 22px;
        }

        .page-title {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            text-align: center;
        }

        .form-container {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;

            padding-bottom: 12vh;
        }

        .form-card {
            width: 100%;

            background: #ffffff;

            border-radius: 24px;

            padding: 30px 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.05);

            border: 1px solid #f1f5f9;
        }

        .section-title {
            font-size: 14px;
            color: #64748b;

            margin-bottom: 10px;

            font-weight: 700;

            display: block;

            text-align: right;
        }

        .custom-btn {
            width: 100%;

            background-color: #f8fafc;

            border: 2px solid #e2e8f0;

            padding: 16px;

            border-radius: 16px;

            color: #1e293b;

            cursor: pointer;

            transition: all 0.3s ease;

            margin-bottom: 25px;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: inherit;
        }

        .custom-btn:hover {
            border-color: #ff8c00;
            background-color: #fffaf5;
        }

        .custom-btn span {
            font-size: 16px;
            font-weight: 700;

            text-align: center;

            z-index: 2;

            pointer-events: none;
        }

        .custom-btn .right-icon {
            position: absolute;
            right: 15px;

            width: 24px;
            height: 24px;

            color: #ff8c00;

            pointer-events: none;
        }

        .custom-btn .left-icon {
            position: absolute;
            left: 15px;

            width: 18px;
            height: 18px;

            color: #94a3b8;

            pointer-events: none;
        }

        .hidden-date-input {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            opacity: 0;

            cursor: pointer;

            z-index: 10;

            -webkit-appearance: none;
        }

        .time-inputs-container {
            display: none;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-bottom: 25px;

            animation: slideDown 0.4s ease forwards;
        }

        @keyframes slideDown {

            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .time-input-box {
            flex: 1;

            display: flex;
            align-items: center;

            background: #f8fafc;

            border: 2px solid #e2e8f0;

            border-radius: 14px;

            padding: 0 12px;

            transition: all 0.3s ease;
        }

        .time-input-box:focus-within {
            border-color: #ff8c00;
            background: #ffffff;
        }

        .time-input-box input {
            flex: 1;

            width: 100%;

            padding: 14px 0;

            border: none;

            background: transparent;

            font-size: 15px;
            font-weight: 700;

            color: #1e293b;

            outline: none;

            font-family: inherit;

            text-align: center;

            direction: ltr;
        }

        .time-icon {
            width: 20px;
            height: 20px;

            color: #ff8c00;

            flex-shrink: 0;
        }

        .time-separator {
            font-size: 15px;
            font-weight: 800;

            color: #94a3b8;

            flex-shrink: 0;
        }

        .message {
            display: none;

            padding: 13px 15px;

            margin-bottom: 18px;

            border-radius: 13px;

            text-align: center;

            font-size: 14px;
            font-weight: 700;

            line-height: 1.6;
        }

        .message.error {
            display: block;

            background: #fef2f2;

            color: #dc2626;

            border: 1px solid #fecaca;
        }

        .submit-btn {
            width: 100%;

            background:
                linear-gradient(
                    135deg,
                    #FF9800 0%,
                    #FF5722 100%
                );

            color: #ffffff;

            border: none;

            padding: 18px 20px;

            border-radius: 16px;

            font-size: 18px;
            font-weight: 700;

            cursor: pointer;

            transition: all 0.3s ease;

            box-shadow:
                0 10px 20px rgba(255, 87, 34, 0.3);

            font-family: inherit;
        }

        .submit-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 15px 25px rgba(255, 87, 34, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.65;

            cursor: not-allowed;

            transform: none;
        }

        .modal-overlay {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background-color:
                rgba(15, 23, 42, 0.5);

            backdrop-filter: blur(4px);

            display: none;

            justify-content: center;
            align-items: center;

            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #ffffff;

            width: 90%;
            max-width: 320px;

            border-radius: 24px;

            padding: 25px;

            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.2);

            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;

            color: #1e293b;

            margin-bottom: 20px;
        }

        .modal-type-btn {
            width: 100%;

            padding: 16px;

            border-radius: 14px;

            border:
                2px solid #e2e8f0;

            background: #f8fafc;

            font-size: 16px;
            font-weight: 700;

            color: #1e293b;

            margin-bottom: 12px;

            cursor: pointer;

            transition: all 0.3s ease;

            font-family: inherit;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;
        }

        .modal-type-btn:hover,
        .modal-type-btn.selected {
            border-color: #ff8c00;

            background-color: #fffaf5;

            color: #ff8c00;
        }

        .success-icon {
            width: 60px;
            height: 60px;

            background-color: #10b981;

            color: white;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0 auto 15px;

            box-shadow:
                0 10px 20px rgba(16, 185, 129, 0.3);

            animation:
                bounceIn 0.5s ease;
        }

        @keyframes bounceIn {

            0% {
                transform: scale(0);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }

        }

        .success-text {
            font-size: 17px;
            font-weight: 700;

            color: #1e293b;

            margin: 0;

            line-height: 1.5;
        }

    </style>

</head>


<body>


<div class="wrapper">


    <!-- TOP BAR -->

    <div class="top-bar">

        <button
            type="button"
            class="back-btn"
            onclick="window.history.back()"
        >

            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2.5"
            >

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9 5l7 7-7 7"
                />

            </svg>

        </button>


        <h1 class="page-title">
            داواكارييا مولەتێ
        </h1>

    </div>



    <!-- FORM -->

    <div class="form-container">


        <div class="form-card">


            <span class="section-title">
                رێکەفتێ هەلبژێرە
            </span>


            <div class="custom-btn">


                <svg
                    class="right-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                    />

                </svg>


                <span id="dateDisplay">
                    رۆژ/هەیڤ/سال
                </span>


                <input
                    type="date"
                    class="hidden-date-input"
                    id="realDateInput"
                >


            </div>



            <span class="section-title">
                جۆرێ مۆلەتێ
            </span>



            <button
                type="button"
                class="custom-btn"
                id="openTypeModalBtn"
            >


                <svg
                    class="right-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                    />

                </svg>


                <span id="typeDisplay">
                    تەمامیا دەمێ کاری
                </span>


                <svg
                    class="left-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M19 9l-7 7-7-7"
                    />

                </svg>


            </button>



            <!-- HOURS -->

            <div
                class="time-inputs-container"
                id="timeInputsContainer"
            >


                <div class="time-input-box">


                    <svg
                        class="time-icon"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                        />

                    </svg>


                    <input
                        type="time"
                        id="startTime"
                        value="09:00"
                    >


                </div>


                <span class="time-separator">
                    بۆ
                </span>


                <div class="time-input-box">


                    <svg
                        class="time-icon"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                        />

                    </svg>


                    <input
                        type="time"
                        id="endTime"
                        value="13:00"
                    >


                </div>


            </div>



            <!-- ERROR -->

            <div
                id="message"
                class="message"
            ></div>



            <!-- SEND -->

            <button
                type="button"
                class="submit-btn"
                id="submitBtn"
            >
                هنارتن
            </button>


        </div>


    </div>


</div>



<!-- TYPE MODAL -->

<div
    class="modal-overlay"
    id="typeModal"
>

    <div class="modal-content">


        <div class="modal-title">
            جۆرێ دەمی هەلبژێرە
        </div>


        <button
            type="button"
            class="modal-type-btn selected"
            id="selectFullDayBtn"
        >
            تەمامیا دەمێ کاری
        </button>


        <button
            type="button"
            class="modal-type-btn"
            id="selectHoursBtn"
        >
            دەمژمێر
        </button>


    </div>

</div>



<!-- SUCCESS MODAL -->

<div
    class="modal-overlay"
    id="successModal"
>

    <div
        class="modal-content"
        style="padding:35px 25px;"
    >


        <div class="success-icon">


            <svg
                xmlns="http://www.w3.org/2000/svg"
                style="width:32px;height:32px;"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="3"
            >

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M5 13l4 4L19 7"
                />

            </svg>


        </div>


        <p class="success-text">

            سوپاس
            <br>
            داواکارییا تە هاتە هنارتن

        </p>


    </div>

</div>



<script type="module">


    /* ==============================
       FIREBASE
    ============================== */

    import {
        initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
        getDatabase,
        ref,
        get,
        push,
        set,
        serverTimestamp
    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";



    const firebaseConfig = {

        apiKey:
            "AIzaSyB83R6OlUr5p7W5EkTvHpwjfgBirsfQbek",

        authDomain:
            "office-8e7cb.firebaseapp.com",

        databaseURL:
            "https://office-8e7cb-default-rtdb.europe-west1.firebasedatabase.app",

        projectId:
            "office-8e7cb",

        storageBucket:
            "office-8e7cb.firebasestorage.app",

        messagingSenderId:
            "604465845047",

        appId:
            "1:604465845047:web:42004e33906c8986ee80b2",

        measurementId:
            "G-LJJM71LQ0K"

    };



    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const database =
        getDatabase(app);



    /* ==============================
       ELEMENTS
    ============================== */

    const realDateInput =
        document.getElementById(
            "realDateInput"
        );


    const dateDisplay =
        document.getElementById(
            "dateDisplay"
        );


    const openTypeModalBtn =
        document.getElementById(
            "openTypeModalBtn"
        );


    const typeModal =
        document.getElementById(
            "typeModal"
        );


    const selectFullDayBtn =
        document.getElementById(
            "selectFullDayBtn"
        );


    const selectHoursBtn =
        document.getElementById(
            "selectHoursBtn"
        );


    const typeDisplay =
        document.getElementById(
            "typeDisplay"
        );


    const timeInputsContainer =
        document.getElementById(
            "timeInputsContainer"
        );


    const startTimeInput =
        document.getElementById(
            "startTime"
        );


    const endTimeInput =
        document.getElementById(
            "endTime"
        );


    const submitBtn =
        document.getElementById(
            "submitBtn"
        );


    const successModal =
        document.getElementById(
            "successModal"
        );


    const message =
        document.getElementById(
            "message"
        );



    let currentUser =
        null;


    let currentProfile =
        null;


    let leaveMode =
        "full_day";



    /* ==============================
       AUTHENTICATION
    ============================== */

    onAuthStateChanged(
        auth,
        async user => {


            if (!user) {


                /*
                 * Molat.html is expected:
                 *
                 * /office/molat/Molat.html
                 *
                 * index.html:
                 *
                 * /index.html
                 */


                window.location.replace(
                    "../../index.html"
                );


                return;

            }


            try {


                const userSnapshot =
                    await get(

                        ref(
                            database,
                            `users/${user.uid}`
                        )

                    );


                if (!userSnapshot.exists()) {


                    await signOut(auth);


                    window.location.replace(
                        "../../index.html"
                    );


                    return;

                }


                const profile =
                    userSnapshot.val();


                if (
                    String(profile.role)
                        .toLowerCase() !==
                    "user"
                ) {


                    await signOut(auth);


                    window.location.replace(
                        "../../index.html"
                    );


                    return;

                }


                if (
                    profile.active === false
                ) {


                    await signOut(auth);


                    window.location.replace(
                        "../../index.html"
                    );


                    return;

                }


                currentUser =
                    user;


                currentProfile =
                    profile;


            }
            catch(error) {


                console.error(
                    "Profile error:",
                    error
                );


                showError(
                    "هەڵە د بارکرنا هەژمارێ تە."
                );

            }


        }
    );



    /* ==============================
       DATE
    ============================== */

    const now =
        new Date();


    const minimumDate =
        `${now.getFullYear()}-${String(
            now.getMonth() + 1
        ).padStart(2, "0")}-${String(
            now.getDate()
        ).padStart(2, "0")}`;


    realDateInput.min =
        minimumDate;



    realDateInput.addEventListener(
        "change",
        function() {


            if (!this.value) {


                dateDisplay.textContent =
                    "رۆژ/هەیڤ/سال";


                return;

            }


            const [
                year,
                month,
                day
            ] =
                this.value.split("-");


            dateDisplay.textContent =
                `${day}/${month}/${year}`;


            dateDisplay.style.color =
                "#1e293b";


        }
    );



    /* ==============================
       TYPE
    ============================== */

    openTypeModalBtn.addEventListener(
        "click",
        function() {


            typeModal.classList.add(
                "active"
            );


        }
    );



    selectFullDayBtn.addEventListener(
        "click",
        function() {


            leaveMode =
                "full_day";


            typeDisplay.textContent =
                "تەمامیا دەمێ کاری";


            selectFullDayBtn.classList.add(
                "selected"
            );


            selectHoursBtn.classList.remove(
                "selected"
            );


            timeInputsContainer.style.display =
                "none";


            typeModal.classList.remove(
                "active"
            );


        }
    );



    selectHoursBtn.addEventListener(
        "click",
        function() {


            leaveMode =
                "hours";


            typeDisplay.textContent =
                "دەمژمێر";


            selectHoursBtn.classList.add(
                "selected"
            );


            selectFullDayBtn.classList.remove(
                "selected"
            );


            timeInputsContainer.style.display =
                "flex";


            typeModal.classList.remove(
                "active"
            );


        }
    );



    typeModal.addEventListener(
        "click",
        function(event) {


            if (
                event.target ===
                typeModal
            ) {


                typeModal.classList.remove(
                    "active"
                );


            }


        }
    );



    /* ==============================
       SEND LEAVE REQUEST
    ============================== */

    submitBtn.addEventListener(
        "click",
        async function() {


            hideError();


            if (
                !currentUser ||
                !currentProfile
            ) {


                showError(
                    "چاڤەرێ بە هەژمارێ تە بهێتە بارکرن."
                );


                return;

            }



            const leaveDate =
                realDateInput.value;



            if (!leaveDate) {


                showError(
                    "هیڤیە رێکەفتێ هەلبژێرە."
                );


                return;

            }



            let startTime =
                null;


            let endTime =
                null;



            if (
                leaveMode ===
                "hours"
            ) {


                startTime =
                    startTimeInput.value;


                endTime =
                    endTimeInput.value;



                if (
                    !startTime ||
                    !endTime
                ) {


                    showError(
                        "هیڤیە دەستپێک و دوماهیکا دەمژمێران هەلبژێرە."
                    );


                    return;

                }



                if (
                    endTime <=
                    startTime
                ) {


                    showError(
                        "دەمێ دوماهیکێ پێدڤیە پشتی دەمێ دەستپێکێ بیت."
                    );


                    return;

                }


            }



            submitBtn.disabled =
                true;


            submitBtn.textContent =
                "چاڤەرێ بە...";


            try {


                /*
                 * push() creates a unique
                 * request ID.
                 */

                const requestRef =
                    push(

                        ref(
                            database,
                            "leaveRequests"
                        )

                    );



                const requestData = {


                    userId:
                        currentUser.uid,


                    name:
                        currentProfile.name ||
                        "بەکارهێنەر",


                    email:
                        currentProfile.email ||
                        currentUser.email ||
                        "",


                    leaveDate:
                        leaveDate,


                    leaveType:
                        leaveMode,


                    leaveTypeText:
                        leaveMode === "hours"
                            ? "دەمژمێر"
                            : "تەمامیا دەمێ کاری",


                    startTime:
                        startTime,


                    endTime:
                        endTime,


                    status:
                        "pending",


                    createdAt:
                        serverTimestamp()


                };



                await set(
                    requestRef,
                    requestData
                );


                console.log(
                    "Leave request ID:",
                    requestRef.key
                );


                successModal.classList.add(
                    "active"
                );


                realDateInput.value =
                    "";


                dateDisplay.textContent =
                    "رۆژ/هەیڤ/سال";


                dateDisplay.style.color =
                    "";


                setTimeout(
                    function() {


                        successModal.classList.remove(
                            "active"
                        );


                    },
                    3000
                );


            }
            catch(error) {


                console.error(
                    "Leave request error:",
                    error
                );


                if (
                    error.code ===
                    "PERMISSION_DENIED" ||
                    error.code ===
                    "database/permission-denied"
                ) {


                    showError(
                        "Database Rules رێکێ نادەن داواکاری بهێتە هنارتن."
                    );


                }
                else {


                    showError(
                        "داواکاری نەهاتە هنارتن. دوبارە هەوڵ بدە."
                    );


                }


            }
            finally {


                submitBtn.disabled =
                    false;


                submitBtn.textContent =
                    "هنارتن";


            }


        }
    );



    /* ==============================
       ERROR
    ============================== */

    function showError(text) {


        message.textContent =
            text;


        message.className =
            "message error";


    }


    function hideError() {


        message.textContent =
            "";


        message.className =
            "message";


    }


</script>
