<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
>

<title>ئاگەهداری - رێڤەبەر</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --orange: #ff8500;
  --orange-dark: #e86f00;
  --orange-soft: #fff4e8;

  --dark: #0f172a;
  --text: #334155;
  --muted: #64748b;

  --background: #f6f8fb;
  --white: #ffffff;
  --border: #e7ecf2;

  --red: #ef4444;
  --green: #059669;
  --blue: #2563eb;
}

body {
  margin: 0;

  min-height: 100vh;

  font-family:
    "Segoe UI",
    Tahoma,
    Geneva,
    Verdana,
    sans-serif;

  background: var(--background);
  color: var(--dark);

  -webkit-tap-highlight-color: transparent;
}

button {
  font: inherit;
  cursor: pointer;
}


/* ==========================================
   WRAPPER
========================================== */

.wrapper {
  width: min(1100px, 100%);

  min-height: 100vh;

  margin: auto;

  padding:
    28px
    20px
    50px;
}


/* ==========================================
   HEADER
========================================== */

.top-bar {
  position: relative;

  min-height: 65px;

  margin:
    5px
    0
    30px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.back-btn {
  position: absolute;

  right: 0;

  width: 52px;
  height: 52px;

  border: 0;
  border-radius: 17px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--orange-soft);
  color: var(--orange-dark);

  transition: .2s ease;
}

.back-btn:hover {
  background: var(--orange);
  color: #fff;

  transform: translateY(-2px);
}

.back-btn svg {
  width: 24px;
  height: 24px;
}

.header-center {
  text-align: center;
}

.page-title {
  margin:
    0
    0
    4px;

  color: var(--dark);

  font-size: 28px;
  font-weight: 900;
}

.page-subtitle {
  color: var(--muted);

  font-size: 13px;
  font-weight: 700;
}

.unread-count {
  position: absolute;

  left: 0;

  min-width: 48px;
  height: 48px;

  padding:
    0
    11px;

  border-radius: 16px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--red);
  color: #fff;

  border:
    4px
    solid
    #fff;

  box-shadow:
    0
    8px
    22px
    rgba(239, 68, 68, .22);

  font-size: 15px;
  font-weight: 900;

  direction: ltr;
}


/* ==========================================
   SUMMARY
========================================== */

.summary {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 14px;

  margin-bottom: 22px;
}

.summary-card {
  min-height: 105px;

  padding: 17px;

  border:
    1px
    solid
    var(--border);

  border-radius: 21px;

  background: #fff;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;

  box-shadow:
    0
    8px
    25px
    rgba(15, 23, 42, .035);
}

.summary-label {
  color: var(--muted);

  font-size: 12px;
  font-weight: 800;

  margin-bottom: 7px;
}

.summary-value {
  color: var(--dark);

  font-size: 30px;
  font-weight: 900;

  direction: ltr;
}


/* ==========================================
   ALERT GRID
========================================== */

.alerts {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 18px;

  padding-bottom: 30px;
}


/* ==========================================
   ALERT CARD
========================================== */

.alert-card {
  position: relative;

  min-width: 0;

  padding: 22px;

  border:
    1px
    solid
    var(--border);

  border-radius: 24px;

  background: #fff;

  box-shadow:
    0
    10px
    30px
    rgba(15, 23, 42, .04);

  cursor: pointer;

  transition: .22s ease;
}

.alert-card:hover {
  transform: translateY(-3px);

  border-color:
    rgba(
      255,
      133,
      0,
      .25
    );

  box-shadow:
    0
    16px
    35px
    rgba(255, 133, 0, .08);
}

.alert-card.unread {
  border-color:
    rgba(
      255,
      133,
      0,
      .34
    );

  background:
    linear-gradient(
      135deg,
      #fff,
      #fffaf4
    );
}

.unread-dot {
  position: absolute;

  top: 18px;
  left: 18px;

  width: 10px;
  height: 10px;

  border-radius: 50%;

  background: var(--orange);

  box-shadow:
    0
    0
    0
    5px
    rgba(255, 133, 0, .1);
}


/* ==========================================
   ALERT HEADER
========================================== */

.alert-head {
  display: flex;
  align-items: flex-start;

  gap: 13px;

  padding-left: 18px;
}

.icon {
  width: 51px;
  height: 51px;

  flex: 0 0 auto;

  border-radius: 16px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--orange-soft);
  color: var(--orange-dark);
}

.icon svg {
  width: 25px;
  height: 25px;
}

.head-text {
  min-width: 0;

  flex: 1;
}

.head-text h3 {
  margin:
    1px
    0
    6px;

  color: #1e293b;

  font-size: 18px;
  font-weight: 900;

  line-height: 1.5;

  word-break: break-word;
}

.date {
  color: #94a3b8;

  font-size: 11px;
  font-weight: 700;

  direction: ltr;

  text-align: right;
}


/* ==========================================
   PREVIEW
========================================== */

.preview {
  margin:
    15px
    0
    0;

  color: var(--muted);

  font-size: 14px;

  line-height: 1.8;

  white-space: pre-wrap;
  word-break: break-word;
}


/* ==========================================
   META
========================================== */

.alert-meta {
  display: flex;
  flex-wrap: wrap;

  gap: 7px;

  margin-top: 16px;
}

.badge {
  min-height: 29px;

  padding:
    6px
    10px;

  border-radius: 999px;

  display: inline-flex;
  align-items: center;

  gap: 5px;

  border:
    1px
    solid
    #e2e8f0;

  background: #f8fafc;

  color: #64748b;

  font-size: 10px;
  font-weight: 850;
}

.badge.all {
  border-color: #fed7aa;

  background: #fff7ed;

  color: #c2410c;
}

.badge.user {
  border-color: #bfdbfe;

  background: #eff6ff;

  color: var(--blue);
}

.badge.email {
  border-color: #a7f3d0;

  background: #ecfdf5;

  color: var(--green);
}


/* ==========================================
   EMPTY / ERROR
========================================== */

.state {
  grid-column:
    1 / -1;

  padding:
    65px
    20px;

  text-align: center;

  background: #fff;

  border:
    1px
    solid
    var(--border);

  border-radius: 25px;

  box-shadow:
    0
    10px
    30px
    rgba(15, 23, 42, .035);
}

.state svg {
  width: 55px;
  height: 55px;

  margin-bottom: 12px;

  color: var(--orange);
}

.state h3 {
  margin:
    0
    0
    7px;

  color: var(--dark);

  font-size: 19px;
  font-weight: 900;
}

.state p {
  margin: 0;

  color: var(--muted);

  font-size: 14px;
}


/* ==========================================
   LOADING
========================================== */

.loading {
  position: fixed;

  inset: 0;

  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--background);
}

.loading.hide {
  display: none;
}

.loader {
  width: 48px;
  height: 48px;

  border-radius: 50%;

  border:
    5px
    solid
    #e5e7eb;

  border-top-color:
    var(--orange);

  animation:
    spin
    .8s
    linear
    infinite;
}

@keyframes spin {
  to {
    transform:
      rotate(360deg);
  }
}


/* ==========================================
   MODAL
========================================== */

.modal {
  position: fixed;

  inset: 0;

  z-index: 5000;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    rgba(
      15,
      23,
      42,
      .52
    );

  backdrop-filter:
    blur(6px);
}

.modal.active {
  display: flex;
}

.modal-card {
  position: relative;

  width:
    min(
      530px,
      100%
    );

  max-height: 88vh;

  overflow: auto;

  padding: 30px;

  border-radius: 28px;

  background: #fff;

  box-shadow:
    0
    30px
    70px
    rgba(0, 0, 0, .22);
}

.close-btn {
  position: absolute;

  top: 17px;
  left: 17px;

  width: 40px;
  height: 40px;

  border: 0;
  border-radius: 13px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #f1f5f9;
  color: #64748b;
}

.close-btn:hover {
  background: #e2e8f0;
}

.close-btn svg {
  width: 19px;
  height: 19px;
}

.modal-icon {
  width: 65px;
  height: 65px;

  margin-bottom: 18px;

  border-radius: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--orange-soft);
  color: var(--orange-dark);
}

.modal-icon svg {
  width: 30px;
  height: 30px;
}

.modal-title {
  margin:
    0
    0
    8px;

  padding-left: 42px;

  color: var(--dark);

  font-size: 24px;
  font-weight: 900;

  line-height: 1.6;
}

.modal-date {
  margin-bottom: 18px;

  color: #94a3b8;

  font-size: 12px;
  font-weight: 700;

  direction: ltr;

  text-align: right;
}

.modal-message {
  margin: 0;

  color: #475569;

  font-size: 15px;

  line-height: 2;

  white-space: pre-wrap;
  word-break: break-word;
}

.modal-meta {
  display: flex;
  flex-wrap: wrap;

  gap: 8px;

  margin-top: 22px;

  padding-top: 18px;

  border-top:
    1px
    solid
    #eef2f7;
}


/* ==========================================
   MOBILE
========================================== */

@media(max-width: 700px) {

  .wrapper {
    padding:
      18px
      14px
      40px;
  }

  .top-bar {
    margin-bottom: 22px;
  }

  .back-btn {
    width: 47px;
    height: 47px;

    border-radius: 15px;
  }

  .page-title {
    font-size: 23px;
  }

  .unread-count {
    min-width: 44px;
    height: 44px;

    border-radius: 14px;

    font-size: 13px;
  }

  .summary {
    gap: 9px;
  }

  .summary-card {
    min-height: 90px;

    padding: 12px 8px;

    border-radius: 18px;
  }

  .summary-label {
    font-size: 10px;
  }

  .summary-value {
    font-size: 26px;
  }

  .alerts {
    grid-template-columns: 1fr;

    gap: 13px;
  }

  .alert-card {
    padding: 18px;

    border-radius: 21px;
  }

  .head-text h3 {
    font-size: 16px;
  }

  .preview {
    font-size: 13px;
  }

  .modal-card {
    padding: 24px 20px;

    border-radius: 23px;
  }

}


/* ==========================================
   LARGE SCREEN
========================================== */

@media(min-width: 1024px) {

  .wrapper {
    padding:
      40px
      36px
      60px;
  }

  .top-bar {
    margin-bottom: 35px;
  }

  .page-title {
    font-size: 35px;
  }

  .page-subtitle {
    font-size: 15px;
  }

  .unread-count {
    min-width: 56px;
    height: 56px;

    font-size: 18px;
  }

  .summary-card {
    min-height: 120px;
  }

  .summary-label {
    font-size: 14px;
  }

  .summary-value {
    font-size: 38px;
  }

  .alert-card {
    padding: 26px;

    border-radius: 27px;
  }

  .icon {
    width: 60px;
    height: 60px;
  }

  .icon svg {
    width: 29px;
    height: 29px;
  }

  .head-text h3 {
    font-size: 21px;
  }

  .preview {
    font-size: 16px;
  }

}

</style>

</head>

<script type="module">


/* ==========================================
   FIREBASE IMPORTS
========================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  get,
  onValue
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";



/* ==========================================
   CONFIG
========================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyB83R6OlUr5p7W5EkTvHpwjfgBirsfQbek",

  authDomain:
    "office-8e7cb.firebaseapp.com",

  databaseURL:
    "https://office-8e7cb-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "office-8e7cb",

  storageBucket:
    "office-8e7cb.firebasestorage.app",

  messagingSenderId:
    "604465845047",

  appId:
    "1:604465845047:web:42004e33906c8986ee80b2",

  measurementId:
    "G-LJJM71LQ0K"

};



const ADMIN_LOGIN_URL =
  "/adminoffice/login/Login.html";


const ADMIN_DASHBOARD_URL =
  "/adminoffice/dashboard/Dashboard.html";



/* ==========================================
   FIREBASE
========================================== */

const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(
    app
  );


const database =
  getDatabase(
    app
  );



/* ==========================================
   ELEMENTS
========================================== */

const pageLoading =
  document.getElementById(
    "pageLoading"
  );


const alertsContainer =
  document.getElementById(
    "alertsContainer"
  );


const unreadCount =
  document.getElementById(
    "unreadCount"
  );


const totalCount =
  document.getElementById(
    "totalCount"
  );


const allCount =
  document.getElementById(
    "allCount"
  );


const userCount =
  document.getElementById(
    "userCount"
  );


const detailsModal =
  document.getElementById(
    "detailsModal"
  );


const closeBtn =
  document.getElementById(
    "closeBtn"
  );


const backBtn =
  document.getElementById(
    "backBtn"
  );


const modalTitle =
  document.getElementById(
    "modalTitle"
  );


const modalDate =
  document.getElementById(
    "modalDate"
  );


const modalMessage =
  document.getElementById(
    "modalMessage"
  );


const modalMeta =
  document.getElementById(
    "modalMeta"
  );



/* ==========================================
   STATE
========================================== */

let currentUser =
  null;


let alertsCache =
  {};


let readIds =
  new Set();



/* ==========================================
   BACK
========================================== */

backBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      ADMIN_DASHBOARD_URL;

  }
);



/* ==========================================
   LOCAL READ STATUS
========================================== */

function storageKey() {

  return (
    `office_admin_read_alerts_${currentUser?.uid || "guest"}`
  );

}



function loadReadIds() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          storageKey()
        ) || "[]"
      );


    readIds =
      new Set(
        Array.isArray(saved)
          ?
          saved
          :
          []
      );

  }
  catch(error) {

    console.error(
      "Read alerts storage error:",
      error
    );


    readIds =
      new Set();

  }

}



function saveReadIds() {

  localStorage.setItem(

    storageKey(),

    JSON.stringify(
      [
        ...readIds
      ]
    )

  );

}



/* ==========================================
   SAFE HTML
========================================== */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* ==========================================
   DATE
========================================== */

function formatDate(
  timestamp
) {

  const value =
    Number(
      timestamp
    );


  if (!value) {

    return "--";

  }


  try {

    return new Intl.DateTimeFormat(
      "en-GB",
      {

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit"

      }
    ).format(
      new Date(value)
    );

  }
  catch(error) {

    return "--";

  }

}



/* ==========================================
   LOGIN
========================================== */

async function goToLogin() {

  try {

    await signOut(
      auth
    );

  }
  catch(error) {

    console.error(
      error
    );

  }


  window.location.replace(
    ADMIN_LOGIN_URL
  );

}



/* ==========================================
   GET ACTIVE ALERTS
========================================== */

function getAlerts() {

  return Object
    .entries(
      alertsCache
    )

    .map(
      ([id, data]) => ({
        id,
        ...(data || {})
      })
    )

    .filter(
      item =>
        item.active !== false
    )

    .sort(
      (a, b) =>

        (
          Number(
            b.createdAt
          ) || 0
        )

        -

        (
          Number(
            a.createdAt
          ) || 0
        )
    );

}



/* ==========================================
   COUNTS
========================================== */

function updateCounts() {

  const alerts =
    getAlerts();


  const unread =
    alerts.filter(
      item =>
        !readIds.has(
          item.id
        )
    );


  const allAlerts =
    alerts.filter(
      item =>
        String(
          item.target || ""
        ).toLowerCase() ===
        "all"
    );


  const userAlerts =
    alerts.filter(
      item =>
        String(
          item.target || ""
        ).toLowerCase() ===
        "user"
    );


  unreadCount.textContent =
    unread.length > 99
      ?
      "99+"
      :
      String(
        unread.length
      );


  totalCount.textContent =
    alerts.length > 999
      ?
      "999+"
      :
      String(
        alerts.length
      );


  allCount.textContent =
    String(
      allAlerts.length
    );


  userCount.textContent =
    String(
      userAlerts.length
    );

}



/* ==========================================
   TARGET INFORMATION
========================================== */

function getTargetText(
  item
) {

  if (
    String(
      item.target || ""
    ).toLowerCase() ===
    "user"
  ) {

    return (
      item.targetUserName ||
      "بەکارهێنەرێ هەلبژارتی"
    );

  }


  return (
    "هەمی بەکارهێنەر"
  );

}



/* ==========================================
   RENDER
========================================== */

function renderAlerts() {

  const alerts =
    getAlerts();


  updateCounts();


  if (
    !alerts.length
  ) {

    alertsContainer.innerHTML = `

      <div class="state">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0a3 3 0 11-6 0"
          />

        </svg>


        <h3>
          هێشتا ئاگەهداری نینن
        </h3>


        <p>
          ئاگەهدارییێن ژ Send Alerts هاتی دێ ل ڤێرێ دیار بن
        </p>

      </div>

    `;


    return;

  }


  alertsContainer.innerHTML =
    alerts

      .map(
        item => {


          const unread =
            !readIds.has(
              item.id
            );


          const target =
            String(
              item.target || "all"
            ).toLowerCase();


          const targetClass =
            target === "user"
              ?
              "user"
              :
              "all";


          const targetText =
            getTargetText(
              item
            );


          const recipientCount =
            Number(
              item.recipientCount || 0
            );


          const emailSent =
            Number(
              item.emailSentCount || 0
            );


          const emailFailed =
            Number(
              item.emailFailedCount || 0
            );


          return `

            <article
              class="
                alert-card
                ${
                  unread
                    ?
                    "unread"
                    :
                    ""
                }
              "
              data-id="${escapeHTML(
                item.id
              )}"
            >


              ${
                unread
                  ?
                  `
                    <span
                      class="unread-dot"
                    ></span>
                  `
                  :
                  ""
              }


              <div class="alert-head">


                <div class="icon">

                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >

                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0a3 3 0 11-6 0"
                    />

                  </svg>

                </div>


                <div class="head-text">

                  <h3>

                    ${escapeHTML(
                      item.title ||
                      "ئاگەهداری"
                    )}

                  </h3>


                  <div class="date">

                    ${escapeHTML(
                      formatDate(
                        item.createdAt
                      )
                    )}

                  </div>

                </div>


              </div>


              <p class="preview">

                ${escapeHTML(
                  item.message || ""
                )}

              </p>


              <div class="alert-meta">


                <span
                  class="
                    badge
                    ${targetClass}
                  "
                >

                  ${
                    target === "user"
                      ?
                      "بۆ:"
                      :
                      "وەرگر:"
                  }

                  ${escapeHTML(
                    targetText
                  )}

                </span>


                <span class="badge">

                  ${recipientCount}

                  وەرگر

                </span>


                <span class="badge email">

                  ${emailSent}

                  ئیمەیڵ

                </span>


                ${
                  emailFailed > 0
                    ?
                    `
                      <span
                        class="badge"
                        style="
                          background:#fef2f2;
                          color:#dc2626;
                          border-color:#fecaca;
                        "
                      >

                        ${emailFailed}

                        سەرنەکەفتی

                      </span>
                    `
                    :
                    ""
                }


              </div>


            </article>

          `;

        }
      )

      .join("");


  alertsContainer
    .querySelectorAll(
      ".alert-card"
    )

    .forEach(
      card => {

        card.addEventListener(
          "click",
          () => {

            openAlert(
              card.dataset.id
            );

          }
        );

      }
    );

}



/* ==========================================
   OPEN ALERT
========================================== */

function openAlert(
  id
) {

  const item =
    alertsCache[id];


  if (!item) {

    return;

  }


  readIds.add(
    id
  );


  saveReadIds();


  modalTitle.textContent =
    item.title ||
    "ئاگەهداری";


  modalDate.textContent =
    formatDate(
      item.createdAt
    );


  modalMessage.textContent =
    item.message ||
    "";


  const target =
    String(
      item.target || "all"
    ).toLowerCase();


  const targetText =
    getTargetText(
      item
    );


  const recipientCount =
    Number(
      item.recipientCount || 0
    );


  const emailSent =
    Number(
      item.emailSentCount || 0
    );


  const emailFailed =
    Number(
      item.emailFailedCount || 0
    );


  modalMeta.innerHTML = `

    <span
      class="
        badge
        ${
          target === "user"
            ?
            "user"
            :
            "all"
        }
      "
    >

      ${
        target === "user"
          ?
          "بۆ:"
          :
          "وەرگر:"
      }

      ${escapeHTML(
        targetText
      )}

    </span>


    <span class="badge">

      ${recipientCount}

      وەرگر

    </span>


    <span class="badge email">

      ${emailSent}

      ئیمەیڵ هاتنە هنارتن

    </span>


    ${
      emailFailed > 0
        ?
        `

          <span
            class="badge"
            style="
              background:#fef2f2;
              color:#dc2626;
              border-color:#fecaca;
            "
          >

            ${emailFailed}

            ئیمەیڵ سەرنەکەفتن

          </span>

        `
        :
        ""
    }


    ${
      item.createdByName
        ?
        `

          <span class="badge">

            ژ لایێ:

            ${escapeHTML(
              item.createdByName
            )}

          </span>

        `
        :
        ""
    }

  `;


  detailsModal
    .classList
    .add(
      "active"
    );


  renderAlerts();

}



/* ==========================================
   CLOSE MODAL
========================================== */

closeBtn.addEventListener(
  "click",
  () => {

    detailsModal
      .classList
      .remove(
        "active"
      );

  }
);



detailsModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      detailsModal
    ) {

      detailsModal
        .classList
        .remove(
          "active"
        );

    }

  }
);



document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Escape"
    ) {

      detailsModal
        .classList
        .remove(
          "active"
        );

    }

  }
);



/* ==========================================
   REALTIME ALERTS

   IMPORTANT:
   SendAlerts API writes master records here:
   /alerts
========================================== */

function startAlertsListener() {

  onValue(

    ref(
      database,
      "alerts"
    ),

    snapshot => {

      alertsCache =
        snapshot.exists()
          ?
          (
            snapshot.val() ||
            {}
          )
          :
          {};


      renderAlerts();

    },

    error => {

      console.error(
        "Alerts listener error:",
        error
      );


      unreadCount.textContent =
        "0";


      totalCount.textContent =
        "0";


      allCount.textContent =
        "0";


      userCount.textContent =
        "0";


      alertsContainer.innerHTML = `

        <div class="state">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0Zm-9 3.75h.008v.008H12v-.008Z"
            />

          </svg>


          <h3>
            هەڵە
          </h3>


          <p>
            ئاگەهداری نەهاتنە بارکرن
          </p>

        </div>

      `;

    }

  );

}



/* ==========================================
   AUTH
========================================== */

onAuthStateChanged(
  auth,
  async user => {


    if (!user) {

      window.location.replace(
        ADMIN_LOGIN_URL
      );


      return;

    }


    try {

      const snapshot =
        await get(

          ref(
            database,
            `users/${user.uid}`
          )

        );


      if (
        !snapshot.exists()
      ) {

        await goToLogin();

        return;

      }


      const profile =
        snapshot.val();


      if (
        String(
          profile.role || ""
        ).toLowerCase() !==
        "owner"

        ||

        profile.active === false
      ) {

        await goToLogin();

        return;

      }


      currentUser =
        user;


      loadReadIds();


      pageLoading
        .classList
        .add(
          "hide"
        );


      startAlertsListener();

    }
    catch(error) {

      console.error(
        "Owner verification error:",
        error
      );


      await goToLogin();

    }

  }
);


</script>
